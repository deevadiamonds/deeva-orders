name: App website (GitHub Pages)

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy1.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Leave test files out
        run: rm -f web/_harness.html
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web
      # GitHub sometimes lists the uploaded site a little late ("No artifacts named github-pages"): wait, and try once more
      - name: Wait for the upload to be listed
        run: sleep 20
      - id: deploy1
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - name: Wait and try again
        if: steps.deploy1.outcome == 'failure'
        run: sleep 60
      - id: deploy
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@v5
