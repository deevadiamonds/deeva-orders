name: Permanent archive (weekly full copy)

# Every week: a full copy of the database (all orders, clients, payments, bills) and every photo / video / voice note goes
# into a separate archive bucket in Google's "Asia" multi-region (kept in several data centres at once; the live data is in
# Mumbai). Nothing in the archive is ever deleted:
# copies are kept in dated folders, files are only added, and a retention policy blocks deletion for 10 years.
on:
  schedule:
    - cron: '30 21 * * 0'   # Monday 03:00 India time
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/archive.yml', 'tools/archive-status.js']

concurrency:
  group: archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Credentials
        id: cred
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then echo "::warning::FIREBASE_SERVICE_ACCOUNT secret is not set — no archive made."; echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/sa.json" >/dev/null 2>&1
          PROJECT=$(python3 -c "import json;print(json.load(open('.firebaserc'))['projects']['default'])")
          gcloud config set project "$PROJECT" >/dev/null 2>&1
          PN=$(gcloud projects describe "$PROJECT" --format='value(projectNumber)')
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "ARCHIVE=gs://deeva-orders-archive-asia-$PN" >> "$GITHUB_ENV"
          echo "OLD_ARCHIVE=gs://deeva-orders-archive-$PN" >> "$GITHUB_ENV"
          echo "LIVE=gs://$(python3 -c "import re;print(re.search(r'storageBucket:\s*\"([^\"]+)\"', open('web/config.js').read()).group(1))")" >> "$GITHUB_ENV"
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Archive bucket (Asia multi-region, kept 10 years, never deleted)
        if: steps.cred.outputs.ok == 'true'
        run: |
          # first try used a Delhi-only bucket, which the database cannot export to; remove it while it is still empty
          if gcloud storage buckets describe "$OLD_ARCHIVE" >/dev/null 2>&1 && [ -z "$(gcloud storage ls "$OLD_ARCHIVE/**" 2>/dev/null | head -1)" ]; then
            gcloud storage buckets delete "$OLD_ARCHIVE" --quiet >/dev/null 2>&1 || true
          fi
          if ! gcloud storage buckets describe "$ARCHIVE" >/dev/null 2>&1; then
            gcloud storage buckets create "$ARCHIVE" --location=ASIA --default-storage-class=NEARLINE \
              --uniform-bucket-level-access --public-access-prevention --quiet
          fi
          gcloud storage buckets update "$ARCHIVE" --retention-period=3650d --soft-delete-duration=90d --quiet >/dev/null

      - name: Copy the database (all orders, clients, payments, bills)
        if: steps.cred.outputs.ok == 'true'
        run: |
          STAMP=$(TZ=Asia/Kolkata date +%Y-%m-%d_%H%M)   # date + time, so a second copy on the same day gets its own folder
          if ! gcloud firestore export "$ARCHIVE/database/$STAMP" --database='(default)' --quiet > "$RUNNER_TEMP/exp.log" 2>&1; then
            echo "::error title=Archive::Database copy failed — $(tail -n 8 "$RUNNER_TEMP/exp.log" | tr '\n' ' ' | head -c 900)"; exit 1
          fi
          tail -n 5 "$RUNNER_TEMP/exp.log"
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"

      - name: Copy every photo, video and voice note (only added, never removed)
        if: steps.cred.outputs.ok == 'true'
        run: |
          if ! gcloud storage rsync "$LIVE" "$ARCHIVE/files" --recursive --quiet > "$RUNNER_TEMP/rs.log" 2>&1; then
            echo "::error title=Archive::File copy failed — $(tail -n 8 "$RUNNER_TEMP/rs.log" | tr '\n' ' ' | head -c 900)"; exit 1
          fi

      - name: Summary
        if: steps.cred.outputs.ok == 'true'
        run: |
          COPIES=$(gcloud storage ls "$ARCHIVE/database/" 2>"$RUNNER_TEMP/ls.log" | wc -l)
          FILES=$(gcloud storage ls "$ARCHIVE/files/**" 2>>"$RUNNER_TEMP/ls.log" | wc -l)
          SIZE=$(gcloud storage du -s "$ARCHIVE" --readable-sizes 2>>"$RUNNER_TEMP/ls.log" | awk '{print $1" "$2}')
          if [ -s "$RUNNER_TEMP/ls.log" ]; then echo "::warning title=Archive listing::$(tr '\n' ' ' < "$RUNNER_TEMP/ls.log" | head -c 600)"; fi
          echo "::notice title=Archive::Copy of $STAMP saved in $ARCHIVE (Asia multi-region) · $COPIES weekly database copies · $FILES files · total $SIZE"
          printf 'COPIES=%s\nFILES=%s\nSIZE=%s\n' "$COPIES" "$FILES" "$SIZE" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        if: always() && steps.cred.outputs.ok == 'true'
        with:
          node-version: '22'

      - name: Show the result in the app (Team page)
        if: always() && steps.cred.outputs.ok == 'true'
        run: |
          (cd functions && npm ci --no-audit --no-fund >/dev/null 2>&1 || npm install --no-audit --no-fund >/dev/null 2>&1)
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" NODE_PATH=functions/node_modules \
            node tools/archive-status.js "${{ job.status }}" "${STAMP:-}" "${COPIES:-0}" "${FILES:-0}" "${SIZE:-}" "$ARCHIVE"
