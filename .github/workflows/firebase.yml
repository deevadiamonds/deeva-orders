name: Firebase (rules + notifications)

# Deploys firestore.rules, storage.rules, firestore.indexes.json and the notification server (functions/)
# whenever they change. Needs the secret FIREBASE_SERVICE_ACCOUNT (service-account key JSON, role Owner)
# and the Blaze plan. Without the secret nothing is deployed — paste the rules in the Firebase console instead.
on:
  push:
    branches: [main]
    paths: ['firestore.rules', 'storage.rules', 'firestore.indexes.json', 'firebase.json', '.firebaserc', 'functions/**', 'tools/storage-selftest.js', 'tools/sheet-status.js', '.github/workflows/firebase.yml']
  workflow_dispatch:

concurrency:
  group: firebase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Credentials
        id: cred
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "::warning::FIREBASE_SERVICE_ACCOUNT secret is not set — nothing deployed (paste the rules in the Firebase console)."
            echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
          echo "PROJECT=$(python3 -c "import json;print(json.load(open('.firebaserc'))['projects']['default'])")" >> "$GITHUB_ENV"
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.cred.outputs.ok == 'true'
        with:
          node-version: '22'

      - name: Report helper
        if: steps.cred.outputs.ok == 'true'
        run: |
          cat > "$RUNNER_TEMP/report.sh" <<'SH'
          # usage: report.sh <title> <logfile> — turns the last lines of a log into an annotation
          msg=$(tail -n 45 "$2" | sed -e 's/\x1b\[[0-9;]*m//g' -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=$1::$msg"
          SH
          chmod +x "$RUNNER_TEMP/report.sh"

      - name: Google Cloud APIs and build permissions
        if: steps.cred.outputs.ok == 'true'
        run: |
          EMAIL=$(python3 -c "import json,os;print(json.load(open(os.environ['GOOGLE_APPLICATION_CREDENTIALS']))['client_email'])")
          echo "::notice title=Service account::$EMAIL"
          gcloud auth activate-service-account --key-file="$GOOGLE_APPLICATION_CREDENTIALS" >/dev/null 2>&1
          gcloud config set project "$PROJECT" >/dev/null 2>&1
          if ! gcloud services enable cloudfunctions.googleapis.com cloudbuild.googleapis.com artifactregistry.googleapis.com \
               run.googleapis.com eventarc.googleapis.com pubsub.googleapis.com compute.googleapis.com \
               firebaserules.googleapis.com fcm.googleapis.com firestore.googleapis.com firebasestorage.googleapis.com cloudbilling.googleapis.com sheets.googleapis.com > "$RUNNER_TEMP/gcp.log" 2>&1; then
            "$RUNNER_TEMP/report.sh" "Could not turn on Google APIs — the service account needs the Owner role (and the project needs the Blaze plan)" "$RUNNER_TEMP/gcp.log"
            exit 1
          fi
          PN=$(gcloud projects describe "$PROJECT" --format='value(projectNumber)')
          for r in roles/cloudbuild.builds.builder roles/artifactregistry.writer roles/logging.logWriter roles/storage.objectViewer roles/eventarc.eventReceiver roles/run.invoker roles/datastore.user roles/firebasecloudmessaging.admin; do
            gcloud projects add-iam-policy-binding "$PROJECT" --member="serviceAccount:$PN-compute@developer.gserviceaccount.com" --role="$r" --condition=None --quiet >/dev/null 2>>"$RUNNER_TEMP/iam.log" || echo "could not add $r" >> "$RUNNER_TEMP/iam.log"
          done
          gcloud projects add-iam-policy-binding "$PROJECT" --member="serviceAccount:service-$PN@gcp-sa-pubsub.iam.gserviceaccount.com" --role=roles/iam.serviceAccountTokenCreator --condition=None --quiet >/dev/null 2>>"$RUNNER_TEMP/iam.log" || true
          # storage.rules look up users/{uid} in Firestore: the Storage service agent must be allowed to read Firestore for rules,
          # otherwise every photo / video / voice-note upload is refused ("permission denied")
          curl -s -X POST -H "Authorization: Bearer $(gcloud auth print-access-token)" -H "Content-Type: application/json" -d '{}' \
            "https://serviceusage.googleapis.com/v1beta1/projects/$PN/services/firebasestorage.googleapis.com:generateServiceIdentity" >/dev/null || true
          SAGENT="serviceAccount:service-$PN@gcp-sa-firebasestorage.iam.gserviceaccount.com"
          for i in 1 2 3; do
            if gcloud projects add-iam-policy-binding "$PROJECT" --member="$SAGENT" --role=roles/firebaserules.firestoreServiceAgent --condition=None --quiet >/dev/null 2>"$RUNNER_TEMP/sagent.log"; then break; fi
            sleep 20
          done
          if gcloud projects get-iam-policy "$PROJECT" --flatten='bindings[].members' --filter="bindings.role:roles/firebaserules.firestoreServiceAgent AND bindings.members:$SAGENT" --format='value(bindings.role)' | grep -q firestoreServiceAgent; then
            echo "::notice title=Storage rules::Storage may read Firestore for the upload rules"
          else
            echo "::error title=Storage rules::Could not let Storage read Firestore — uploads will be refused. $(tr '\n' ' ' < "$RUNNER_TEMP/sagent.log" | head -c 600)"
          fi
          ERR=$(grep -v '^Updated IAM policy' "$RUNNER_TEMP/iam.log" | tr '\n' ' ' | head -c 1500)
          if [ -n "$ERR" ]; then echo "::warning title=IAM::$ERR"; fi

      - name: Data safety (daily database backups, 7-day point-in-time recovery, photos kept 30 days after any delete)
        if: steps.cred.outputs.ok == 'true'
        continue-on-error: true
        run: |
          : > "$RUNNER_TEMP/bk.log"
          gcloud firestore databases update --database='(default)' --enable-pitr --quiet >/dev/null 2>>"$RUNNER_TEMP/bk.log" || echo "point-in-time recovery: failed" >> "$RUNNER_TEMP/bk.log"
          if ! gcloud firestore backups schedules list --database='(default)' --format='value(name)' 2>>"$RUNNER_TEMP/bk.log" | grep -q .; then
            gcloud firestore backups schedules create --database='(default)' --recurrence=daily --retention=30d --quiet >/dev/null 2>>"$RUNNER_TEMP/bk.log" || echo "daily backup schedule: failed" >> "$RUNNER_TEMP/bk.log"
          fi
          BUCKET=$(python3 -c "import re;print(re.search(r'storageBucket:\s*\"([^\"]+)\"', open('web/config.js').read()).group(1))")
          gcloud storage buckets update "gs://$BUCKET" --soft-delete-duration=30d --quiet >/dev/null 2>>"$RUNNER_TEMP/bk.log" || echo "photo soft delete: failed" >> "$RUNNER_TEMP/bk.log"
          SCHED=$(gcloud firestore backups schedules list --database='(default)' --format='value(retention)' 2>/dev/null | head -1)
          PITR=$(gcloud firestore databases describe --database='(default)' --format='value(pointInTimeRecoveryEnablement)' 2>/dev/null)
          SOFT=$(gcloud storage buckets describe "gs://$BUCKET" --format='value(soft_delete_policy.retentionDurationSeconds)' 2>/dev/null)
          echo "::notice title=Backups::Daily database backup kept ${SCHED:-?} · point-in-time recovery ${PITR:-?} · deleted photos kept ${SOFT:-?} s"
          if grep -q failed "$RUNNER_TEMP/bk.log"; then echo "::warning title=Backups::$(tr '\n' ' ' < "$RUNNER_TEMP/bk.log" | head -c 900)"; fi

      - name: Deploy security rules and indexes
        if: steps.cred.outputs.ok == 'true'
        run: |
          set -o pipefail
          npx --yes firebase-tools@14 deploy --only firestore:rules,firestore:indexes,storage --project "$PROJECT" --non-interactive --force 2>&1 | tee "$RUNNER_TEMP/rules.log" \
            || { "$RUNNER_TEMP/report.sh" "Rules deploy failed" "$RUNNER_TEMP/rules.log"; exit 1; }

      - name: Install function packages
        if: steps.cred.outputs.ok == 'true'
        working-directory: functions
        run: npm install --no-audit --no-fund

      - name: Upload self-test (photo into Storage, as the app does)
        if: steps.cred.outputs.ok == 'true'
        continue-on-error: true
        run: |
          for i in 1 2 3 4 5 6; do
            R=$(NODE_PATH=functions/node_modules node tools/storage-selftest.js 2>&1 | tail -n 1)
            case "$R" in
              PASS*) echo "::notice title=Upload self-test::Photo upload works (attempt $i)"; exit 0 ;;
              SKIP*) echo "::notice title=Upload self-test::Skipped — the Admin account has not been set up yet"; exit 0 ;;
            esac
            echo "attempt $i: $R"; sleep 30
          done
          echo "::error title=Upload self-test::Photo upload is still refused — $R"
          exit 1

      - name: Google Sheet backup status
        if: steps.cred.outputs.ok == 'true'
        continue-on-error: true
        run: echo "::notice title=Google Sheet::$(NODE_PATH=functions/node_modules node tools/sheet-status.js 2>&1 | tail -n 1)"

      - name: Deploy notification functions
        if: steps.cred.outputs.ok == 'true'
        run: |
          set -o pipefail
          OWNER=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          printf 'APP_URL=https://%s.github.io/%s/\n' "$OWNER" "${GITHUB_REPOSITORY#*/}" > functions/.env
          for i in 1 2 3; do
            if npx --yes firebase-tools@14 deploy --only functions --project "$PROJECT" --non-interactive --force 2>&1 | tee "$RUNNER_TEMP/fn.log"; then
              echo "::notice::Notification functions deployed (attempt $i)"; exit 0
            fi
            echo "::warning::functions deploy attempt $i failed — retrying in 90s (first deploys often wait for Google permissions)"
            sleep 90
          done
          "$RUNNER_TEMP/report.sh" "Functions deploy failed" "$RUNNER_TEMP/fn.log"
          exit 1
