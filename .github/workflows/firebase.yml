name: Firebase (security rules)

# Deploys firestore.rules, storage.rules and firestore.indexes.json when they change.
# Needs the secret FIREBASE_SERVICE_ACCOUNT (a service-account key JSON with the Owner role).
# Without it nothing is deployed — paste the rules in the Firebase console instead.
on:
  push:
    branches: [main]
    paths: ['firestore.rules', 'storage.rules', 'firestore.indexes.json', 'firebase.json', '.firebaserc', '.github/workflows/firebase.yml']
  workflow_dispatch:

concurrency:
  group: firebase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Credentials
        id: cred
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "::warning::FIREBASE_SERVICE_ACCOUNT secret is not set — rules not deployed (paste them in the Firebase console)."
            echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
          echo "PROJECT=$(python3 -c "import json;print(json.load(open('.firebaserc'))['projects']['default'])")" >> "$GITHUB_ENV"
          echo "ok=true" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.cred.outputs.ok == 'true'
        with:
          node-version: '22'
      - name: Deploy rules and indexes
        if: steps.cred.outputs.ok == 'true'
        run: |
          set -o pipefail
          npx --yes firebase-tools@14 deploy --only firestore:rules,firestore:indexes,storage --project "$PROJECT" --non-interactive --force 2>&1 | tee "$RUNNER_TEMP/rules.log" || {
            msg=$(tail -n 45 "$RUNNER_TEMP/rules.log" | sed -e 's/\x1b\[[0-9;]*m//g' -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Rules deploy failed::$msg"; exit 1; }
