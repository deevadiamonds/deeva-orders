<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Deeva Orders</title>
<meta name="description" content="Deeva Diamonds — made-to-order jewellery orders: store, approval, factory tracking">
<meta name="theme-color" content="#0d3b25">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Deeva Orders">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;700&family=Montserrat:wght@500;600;700&family=Playfair+Display:wght@600;700&display=swap">
<style>
:root{
  --bg:#f4efe4; --card:#ffffff; --card2:#faf6ec; --ink:#1b2620; --ink2:#535e57; --line:#e2dac8; --line2:#cfc4aa;
  --g7:#0f5330; --g8:#0d3b25; --g9:#0a271b; --gold:#e7b150; --gold-ink:#875810; --gold-soft:#fbf0d6; --cream:#f6eedc;
  --ok:#17663b; --ok-soft:#e1f1e6; --warn:#8a4e00; --warn-soft:#fdebc9; --bad:#ad261c; --bad-soft:#fbe3df; --mute:#5f6660; --mute-soft:#ebe7dc;
  --shadow:0 1px 2px rgba(10,39,27,.06),0 6px 18px rgba(10,39,27,.07);
  --r:14px; --font:"Mukta","Montserrat",system-ui,sans-serif; --num:"Montserrat","Mukta",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0b1510; --card:#13211a; --card2:#182a21; --ink:#efe9dc; --ink2:#b4bdb5; --line:#26392e; --line2:#34503f;
    --gold-ink:#f0c46e; --gold-soft:#3a2e14; --ok:#86d8a7; --ok-soft:#173a26; --warn:#f3b863; --warn-soft:#3b2a10;
    --bad:#ff9a8f; --bad-soft:#3d1a17; --mute:#aab2ab; --mute-soft:#1f2d25; --shadow:none; color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
[hidden]{display:none!important}
img{max-width:100%}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:30;background:linear-gradient(120deg,var(--g7),var(--g9));color:var(--cream);padding:calc(env(safe-area-inset-top) + 8px) 14px 8px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none;min-width:0}
.brand img{width:30px;height:auto;flex:none}
.brand b{font-family:"Playfair Display",Georgia,serif;font-weight:700;font-size:19px;letter-spacing:.2px;white-space:nowrap}
.brand small{display:block;font-family:var(--num);font-size:9.5px;letter-spacing:2.2px;color:var(--gold);font-weight:600;margin-top:-2px}
.top .sp{flex:1}
.who{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.08);border:1px solid rgba(231,177,80,.45);border-radius:999px;padding:4px 10px 4px 4px;cursor:pointer;color:var(--cream);max-width:52vw}
.who .av{width:26px;height:26px;border-radius:50%;background:var(--gold);color:var(--g9);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.who span{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who em{font-style:normal;font-size:11px;color:var(--gold);font-family:var(--num);font-weight:600}
.net{background:var(--warn-soft);color:var(--warn);text-align:center;font-size:13.5px;padding:5px 10px}

/* ---------- tabs ---------- */
.tabs{position:sticky;top:calc(env(safe-area-inset-top) + 50px);z-index:25;display:flex;gap:4px;background:var(--card);border-bottom:1px solid var(--line);padding:0 8px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;text-decoration:none;text-align:center;padding:11px 12px 9px;font-weight:600;font-size:15px;color:var(--ink2);border-bottom:3px solid transparent;white-space:nowrap}
.tab.on{color:var(--g7);border-bottom-color:var(--gold)}
@media (prefers-color-scheme: dark){.tab.on{color:var(--gold)}}
.tab i{font-style:normal;display:inline-block;min-width:20px;padding:0 6px;margin-left:5px;border-radius:999px;background:var(--bad);color:#fff;font-size:12px;font-family:var(--num);line-height:20px}

main{max-width:680px;margin:0 auto;padding:14px 14px 130px}
.view-title{font-family:"Playfair Display",Georgia,serif;font-size:22px;margin:4px 2px 12px;font-weight:700}
.muted{color:var(--ink2)}
.small{font-size:13.5px}
.center{text-align:center}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}

/* ---------- cards & buttons ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}
.card h3 .tag{margin-left:auto}
.btn{appearance:none;border:1px solid var(--line2);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 14px;font-weight:600;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;min-height:44px;line-height:1.2}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--g7);border-color:var(--g7);color:var(--cream)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--g9)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--g7)}
@media (prefers-color-scheme: dark){.btn.ghost{color:var(--gold)}}
.btn.big{width:100%;padding:14px;font-size:17px;border-radius:14px}
.btn.sm{min-height:34px;padding:6px 10px;font-size:14px;border-radius:10px}
.btn.wa{background:#1f8a4c;border-color:#1f8a4c;color:#fff}
.btn[disabled]{opacity:.55;pointer-events:none}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns .btn{flex:1 1 auto}

.pill{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:600;border-radius:999px;padding:2px 9px;white-space:nowrap;font-family:var(--font)}
.pill.gold{background:var(--gold-soft);color:var(--gold-ink)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.ok2{background:var(--ok-soft);color:var(--ok);border:1px solid var(--ok)}
.pill.dark{background:var(--g8);color:var(--cream)}
.pill.mute{background:var(--mute-soft);color:var(--mute)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}

.cnt{display:inline-flex;align-items:center;gap:5px;font-weight:700;font-size:13.5px;border-radius:9px;padding:3px 9px;font-family:var(--font);white-space:nowrap}
.cnt b{font-family:var(--num);font-size:15px}
.cnt.ok{background:var(--ok-soft);color:var(--ok)}
.cnt.gold{background:var(--gold-soft);color:var(--gold-ink)}
.cnt.warn{background:var(--warn-soft);color:var(--warn)}
.cnt.bad{background:var(--bad-soft);color:var(--bad)}
.cnt.mute{background:var(--mute-soft);color:var(--mute)}

/* ---------- home list ---------- */
.filters{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 10px;margin:0 -2px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fchip{flex:none;border:1px solid var(--line2);background:var(--card);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600;cursor:pointer;display:flex;gap:6px;align-items:center;color:var(--ink2)}
.fchip b{font-family:var(--num);font-size:12.5px;background:var(--mute-soft);color:var(--ink);border-radius:999px;padding:0 7px;line-height:20px}
.fchip.on{background:var(--g7);border-color:var(--g7);color:var(--cream)}
.fchip.on b{background:var(--gold);color:var(--g9)}
.fchip.alert b{background:var(--bad);color:#fff}
.search{width:100%;border:1px solid var(--line2);background:var(--card);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:15px}
.ocard{display:block;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 13px;margin-bottom:10px;position:relative}
.ocard.hot{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold-soft),var(--shadow)}
.oc-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ono{font-family:var(--num);font-weight:700;font-size:15px;letter-spacing:.3px;margin-right:auto}
.oc-name{font-weight:700;font-size:16.5px;margin-top:4px}
.oc-item{color:var(--ink2);font-size:14.5px;margin-top:1px}
.oc-foot{display:flex;align-items:center;gap:8px;margin-top:9px;flex-wrap:wrap}
.oc-stage{font-size:13.5px;font-weight:600;color:var(--ink2);display:flex;align-items:center;gap:6px;margin-right:auto}
.bar{display:inline-block;width:66px;height:6px;border-radius:9px;background:var(--mute-soft);overflow:hidden;vertical-align:middle}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--g7))}
.empty{text-align:center;color:var(--ink2);padding:34px 10px}
.empty b{display:block;font-size:17px;color:var(--ink);margin-bottom:4px}

/* ---------- forms ---------- */
.sec{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 14px 6px;margin-bottom:12px;box-shadow:var(--shadow)}
.sec-h{display:flex;align-items:center;gap:10px;margin:0 0 12px}
.sec-h .n{width:28px;height:28px;border-radius:50%;background:var(--g7);color:var(--gold);display:grid;place-items:center;font-family:var(--num);font-weight:700;font-size:14px;flex:none}
.sec-h b{font-size:17px}
.sec-h small{display:block;font-size:13px;color:var(--ink2);font-weight:400;line-height:1.3}
.fld{margin-bottom:13px}
.fld>label,.lbl{display:block;font-weight:600;font-size:14.5px;margin-bottom:5px}
.req{color:var(--bad);margin-left:2px}
.inp{display:flex;align-items:stretch;gap:6px}
.inp input,.inp textarea,.inp select,input.in,textarea.in,select.in{flex:1;min-width:0;width:100%;border:1px solid var(--line2);background:var(--card2);border-radius:11px;padding:10px 12px;font-size:16px;outline:none}
.inp textarea,textarea.in{min-height:84px;resize:vertical}
.inp input:focus,.inp textarea:focus,input.in:focus,textarea.in:focus,select.in:focus{border-color:var(--g7);box-shadow:0 0 0 3px rgba(15,83,48,.14)}
.fld.miss .inp input,.fld.miss .inp textarea,.fld.miss .chips,.fld.miss>input.in,.check.miss,#w-sig.miss .sig-wrap{outline:2px solid var(--bad);outline-offset:2px;border-radius:11px}
.hint{font-size:13px;color:var(--ink2);margin-top:4px}
.mic{flex:none;width:46px;border-radius:11px;border:1px solid var(--line2);background:var(--card);display:grid;place-items:center;cursor:pointer;font-size:19px}
.mic.on{background:var(--bad);border-color:var(--bad);color:#fff;animation:pulse 1.1s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(173,38,28,.45)}70%{box-shadow:0 0 0 10px rgba(173,38,28,0)}100%{box-shadow:0 0 0 0 rgba(173,38,28,0)}}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line2);background:var(--card2);border-radius:10px;padding:7px 12px;font-size:15px;cursor:pointer;font-weight:500;min-height:38px}
.chip.on{background:var(--g7);border-color:var(--g7);color:var(--cream);font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two .fld{min-width:0}
.check{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line2);border-radius:11px;background:var(--card2);cursor:pointer;margin-bottom:10px}
.check input{width:22px;height:22px;margin:1px 0 0;accent-color:var(--g7);flex:none}
.terms{margin:0 0 12px;padding:0;list-style:none;counter-reset:t}
.terms li{counter-increment:t;display:flex;gap:9px;font-size:14px;padding:6px 0;border-bottom:1px dashed var(--line)}
.terms li::before{content:counter(t);font-family:var(--num);font-weight:700;color:var(--gold-ink);min-width:16px}
.sig-wrap{position:relative;border:1.5px dashed var(--line2);border-radius:12px;background:#fff;touch-action:none;margin-bottom:6px}
.sig-wrap canvas{display:block;width:100%;height:170px;border-radius:12px}
.sig-wrap span{position:absolute;left:12px;bottom:8px;font-size:12.5px;color:#8a8f88;pointer-events:none}
.calc{border:1px solid var(--line);background:var(--card2);border-radius:12px;padding:12px;margin-bottom:12px}
.calc .two{gap:8px}
.calc-out{font-family:var(--num);font-size:13.5px;border-top:1px solid var(--line);margin-top:6px;padding-top:8px}
.calc-out div{display:flex;justify-content:space-between;padding:2px 0}
.calc-out .fin{font-weight:700;font-size:15.5px;color:var(--g7)}
@media (prefers-color-scheme: dark){.calc-out .fin{color:var(--gold)}}
.stick{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -4px 18px rgba(0,0,0,.08)}
.stick .in2{max-width:680px;margin:0 auto;display:flex;gap:8px;align-items:center}
.stick .btn{flex:1}
.prog{font-family:var(--num);font-size:12.5px;font-weight:700;color:var(--ink2);white-space:nowrap}

/* ---------- media ---------- */
.mbtns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.mbtns .btn{flex-direction:column;gap:2px;padding:9px 4px;font-size:13.5px;min-height:62px}
.mbtns .btn span{font-size:21px;line-height:1}
.mbtns .btn.rec{background:var(--bad);border-color:var(--bad);color:#fff}
.mitem{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:8px;margin-bottom:8px;background:var(--card2)}
.mthumb{width:76px;height:76px;border-radius:9px;background:var(--mute-soft);flex:none;overflow:hidden;display:grid;place-items:center;font-size:26px;position:relative}
.mthumb img,.mthumb video{width:100%;height:100%;object-fit:cover}
.mthumb .pr{position:absolute;left:0;right:0;bottom:0;height:5px;background:rgba(0,0,0,.25)}
.mthumb .pr i{display:block;height:100%;background:var(--gold)}
.mbody{flex:1;min-width:0}
.mbody audio{width:100%;height:36px;margin-bottom:4px}
.mbody input{width:100%;border:1px solid var(--line2);background:var(--card);border-radius:9px;padding:7px 9px;font-size:15px}
.mmeta{display:flex;align-items:center;gap:8px;margin-top:5px;font-size:13px;color:var(--ink2);flex-wrap:wrap}
.mmeta label{display:flex;align-items:center;gap:5px;cursor:pointer}
.mmeta input[type=checkbox]{width:18px;height:18px;accent-color:var(--g7)}
.mdel{flex:none;border:none;background:none;font-size:18px;cursor:pointer;color:var(--ink2);padding:2px 4px}
.gal{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.gi{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card2)}
.gi.wide{grid-column:1/-1}
.gi img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;cursor:zoom-in;background:var(--mute-soft)}
.gi video{display:block;width:100%;max-height:340px;background:#000}
.gi audio{display:block;width:100%;margin:10px 0 0}
.gi .cap{padding:7px 9px;font-size:14px}
.gi .cap small{display:block;color:var(--ink2);font-size:12px}
.lock{font-size:12px;font-weight:600;color:var(--gold-ink);background:var(--gold-soft);border-radius:6px;padding:1px 6px;display:inline-block;margin-bottom:3px}

/* ---------- detail ---------- */
.dhead{background:linear-gradient(120deg,var(--g7),var(--g9));color:var(--cream);border-radius:var(--r);padding:15px;margin-bottom:12px;box-shadow:var(--shadow)}
.dhead .no{font-family:"Playfair Display",Georgia,serif;font-size:26px;font-weight:700;letter-spacing:.5px}
.dhead .sub{font-size:14px;opacity:.85}
.dhead .row{margin-top:8px}
.dues{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.due{background:rgba(255,255,255,.07);border:1px solid rgba(231,177,80,.35);border-radius:12px;padding:8px 10px}
.due small{display:block;font-size:12px;color:var(--gold);font-weight:600;letter-spacing:.3px}
.due b{display:block;font-size:15.5px}
.due .cnt{margin-top:4px}
.alertbox{border-radius:var(--r);padding:13px 14px;margin-bottom:12px;border:1.5px solid}
.alertbox.bad{background:var(--bad-soft);border-color:var(--bad)}
.alertbox.gold{background:var(--gold-soft);border-color:var(--gold)}
.alertbox.ok{background:var(--ok-soft);border-color:var(--ok)}
.alertbox h4{margin:0 0 4px;font-size:16px}
.alertbox p{margin:0 0 10px;white-space:pre-wrap}
.kv{display:grid;grid-template-columns:42% 1fr;border-top:1px solid var(--line)}
.kv>div{padding:8px 2px;border-bottom:1px solid var(--line);font-size:15px;min-width:0;overflow-wrap:anywhere}
.kv>div:nth-child(odd){color:var(--ink2);font-size:14px}
.kv>div:nth-child(even){font-weight:600}
.kv .full{grid-column:1/-1;font-weight:500!important;color:var(--ink)!important;white-space:pre-wrap;font-size:15px!important}
.edited{font-size:11.5px;font-weight:600;color:var(--warn);background:var(--warn-soft);border-radius:6px;padding:0 5px;margin-left:5px;white-space:nowrap}
.steps{list-style:none;margin:0;padding:0}
.steps li{display:flex;gap:10px;align-items:center;padding:5px 0;font-size:14.5px;color:var(--ink2);position:relative}
.steps li .d{width:22px;height:22px;border-radius:50%;border:2px solid var(--line2);flex:none;display:grid;place-items:center;font-size:12px;background:var(--card)}
.steps li.done{color:var(--ink)}
.steps li.done .d{background:var(--g7);border-color:var(--g7);color:var(--gold)}
.steps li.cur{color:var(--ink);font-weight:700}
.steps li.cur .d{border-color:var(--gold);background:var(--gold);color:var(--g9)}
.steps li small{margin-left:auto;font-size:12.5px;color:var(--ink2);font-weight:400}
.money{font-family:var(--num);font-weight:700}
.pay{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14.5px}
.tot{display:flex;justify-content:space-between;padding:6px 0;font-size:15.5px}
.tot.big{font-size:17px;font-weight:700}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.tl .ic{width:30px;height:30px;border-radius:50%;background:var(--mute-soft);display:grid;place-items:center;flex:none;font-size:15px}
.tl .tx{flex:1;min-width:0;font-size:14.5px;white-space:pre-wrap;overflow-wrap:anywhere}
.tl .tx small{display:block;color:var(--ink2);font-size:12.5px;margin-top:1px}
.sigimg{max-width:220px;background:#fff;border:1px solid var(--line);border-radius:10px;display:block;margin-top:6px}

/* ---------- sheet (dialog) ---------- */
.sheet-bg{position:fixed;inset:0;background:rgba(5,15,10,.55);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:680px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:6px 16px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -10px 30px rgba(0,0,0,.25);animation:up .18s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sheet .grab{width:44px;height:5px;border-radius:9px;background:var(--line2);margin:6px auto 8px}
.sheet h2{font-size:19px;margin:4px 0 12px;display:flex;align-items:center;gap:8px}
.sheet h2 button{margin-left:auto}
.lightbox{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.92);display:grid;place-items:center;padding:12px}
.lightbox img{max-width:100%;max-height:88vh;border-radius:8px}
.lightbox p{color:#fff;text-align:center;margin:10px 0 0}
.lightbox button{position:absolute;top:calc(env(safe-area-inset-top) + 10px);right:12px;background:rgba(255,255,255,.15);border:none;color:#fff;font-size:22px;width:44px;height:44px;border-radius:50%}
.miss-list{margin:0 0 12px;padding:0;list-style:none}
.miss-list li{padding:9px 12px;border:1px solid var(--bad);background:var(--bad-soft);color:var(--bad);border-radius:10px;margin-bottom:6px;cursor:pointer;font-weight:600}

<script>
/* Firebase web config of the "Deeva Orders" project (public, safe to commit). */
window.DO_CONFIG = {
  apiKey: "",
  authDomain: "",
  projectId: "",
  storageBucket: "",
  messagingSenderId: "",
  appId: ""
};

/* Firebase adapter: the app talks only to window.DO_BACKEND */
(function(){
  if (window.DO_BACKEND || !window.firebase || !window.DO_CONFIG.apiKey) return;
  const cfg = window.DO_CONFIG;
  firebase.initializeApp(cfg);
  const auth = firebase.auth();
  const fs = firebase.firestore();
  try { fs.enablePersistence({synchronizeTabs: true}).catch(() => {}); } catch (e) {}
  const st = firebase.storage();
  let sec = null;
  const secondary = () => (sec = sec || firebase.initializeApp(cfg, 'do-secondary'));
  const toUser = u => u ? {uid: u.uid, email: u.email} : null;
  const flatten = (obj, pre, out) => {
    out = out || {};
    for (const k of Object.keys(obj)) {
      const v = obj[k], key = pre ? pre + '.' + k : k;
      if (v && typeof v === 'object' && !Array.isArray(v) && Object.getPrototypeOf(v) === Object.prototype && Object.keys(v).length) flatten(v, key, out);
      else out[key] = v;
    }
    return out;
  };
  const q = (col, filters, opts) => {
    let r = fs.collection(col);
    (filters || []).forEach(f => { r = r.where(f[0], f[1], f[2]); });
    if (opts && opts.orderBy) r = r.orderBy(opts.orderBy[0], opts.orderBy[1] || 'asc');
    if (opts && opts.limit) r = r.limit(opts.limit);
    return r;
  };
  const docs = snap => snap.docs.map(d => ({id: d.id, data: d.data()}));
  window.DO_BACKEND = {
    projectId: cfg.projectId,
    auth: {
      onChange: cb => auth.onAuthStateChanged(u => cb(toUser(u))),
      current: () => toUser(auth.currentUser),
      signIn: (email, pw) => auth.signInWithEmailAndPassword(email, pw).then(c => toUser(c.user)),
      signUpSelf: (email, pw) => auth.createUserWithEmailAndPassword(email, pw).then(c => toUser(c.user)),
      signOut: () => auth.signOut(),
      createUser: async (email, pw) => {
        const a = secondary().auth();
        await a.setPersistence(firebase.auth.Auth.Persistence.NONE);
        const c = await a.createUserWithEmailAndPassword(email, pw);
        const uid = c.user.uid;
        await a.signOut();
        return uid;
      },
      changePassword: async (cur, nw) => {
        const u = auth.currentUser;
        if (!u) throw {code: 'auth/no-user'};
        await u.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(u.email, cur));
        await u.updatePassword(nw);
      },
      sendReset: email => auth.sendPasswordResetEmail(email)
    },
    storage: {
      upload: (path, blob, contentType, onProgress) => new Promise((resolve, reject) => {
        const ref = st.ref(path);
        const task = ref.put(blob, {contentType: contentType || blob.type || 'application/octet-stream'});
        task.on('state_changed',
          s => { if (onProgress && s.totalBytes) onProgress(s.bytesTransferred / s.totalBytes); },
          reject,
          () => ref.getDownloadURL().then(url => resolve({url, path}), reject));
      })
    },
    db: {
      newId: col => fs.collection(col).doc().id,
      get: path => fs.doc(path).get().then(s => ({exists: s.exists, data: s.exists ? s.data() : null})),
      set: (path, data) => fs.doc(path).set(data),
      update: (path, data) => fs.doc(path).update(flatten(data)),
      batch: ops => {
        const b = fs.batch();
        ops.forEach(o => {
          const r = fs.doc(o.path);
          if (o.op === 'set') b.set(r, o.data); else if (o.op === 'update') b.update(r, flatten(o.data)); else b.delete(r);
        });
        return b.commit();
      },
      /* Reads counter doc, writes counter+1 and the docs built from the new number — all in one transaction. */
      counterTx: (counterPath, build) => fs.runTransaction(async tx => {
        const cref = fs.doc(counterPath);
        const s = await tx.get(cref);
        const n = (s.exists ? (s.data().n || 0) : 0) + 1;
        tx.set(cref, {n});
        build(n).forEach(o => tx.set(fs.doc(o.path), o.data));
        return n;
      }),
      watchDoc: (path, cb, err) => fs.doc(path).onSnapshot(s => cb({exists: s.exists, data: s.exists ? s.data() : null}), err),
      watchQuery: (col, filters, cb, err, opts) => q(col, filters, opts).onSnapshot(snap => {
        cb(docs(snap), snap.docChanges().map(c => ({type: c.type, id: c.doc.id, pending: c.doc.metadata.hasPendingWrites})), {fromCache: snap.metadata.fromCache});
      }, err),
      getQuery: (col, filters, opts) => q(col, filters, opts).get().then(docs)
    }
  };
})();
</script>
<script>
(function(){
'use strict';
const B = window.DO_BACKEND;
const NATIVE = window.DeevaApp || null;
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const pad = n => String(n).padStart(2, '0');
const dayOf = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const today = () => dayOf(new Date());
const parseDay = s => { const p = String(s).split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); };
const addDays = (s, n) => { const d = parseDay(s); d.setDate(d.getDate() + n); return dayOf(d); };
const diffDays = (a, b) => Math.round((parseDay(a) - parseDay(b)) / 86400000);
const HMON = ['जन','फ़र','मार्च','अप्रैल','मई','जून','जुलाई','अग','सित','अक्टू','नव','दिस'];
const fmtDay = s => { if (!s) return ''; const d = parseDay(s); return d.getDate() + ' ' + HMON[d.getMonth()] + (d.getFullYear() !== new Date().getFullYear() ? ' ' + d.getFullYear() : ''); };
const fmtTime = ms => { const d = new Date(ms); let h = d.getHours(); const ap = h >= 12 ? 'pm' : 'am'; h = h % 12 || 12; return h + ':' + pad(d.getMinutes()) + ' ' + ap; };
const fmtWhen = ms => { if (!ms) return ''; const s = dayOf(new Date(ms)), t = today(); if (s === t) return 'आज ' + fmtTime(ms); if (s === addDays(t, -1)) return 'कल ' + fmtTime(ms); return fmtDay(s) + ', ' + fmtTime(ms); };
const num = v => { const n = parseFloat(String(v == null ? '' : v).replace(/[,₹\s]/g, '')); return isFinite(n) ? n : 0; };
const money = v => '₹' + Math.round(num(v)).toLocaleString('en-IN');
const money2 = v => '₹' + (Math.round(num(v) * 100) / 100).toLocaleString('en-IN', {minimumFractionDigits: 0, maximumFractionDigits: 2});
const initial = s => (Array.from(String(s || '?').trim())[0] || '?').toUpperCase();
const digits = s => String(s || '').replace(/\D/g, '');
const phone10 = s => digits(s).slice(-10);
const rid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const get = (o, path) => path.split('.').reduce((a, k) => (a == null ? undefined : a[k]), o);
const setp = (o, path, v) => { const ks = path.split('.'); let x = o; for (let i = 0; i < ks.length - 1; i++) { if (typeof x[ks[i]] !== 'object' || x[ks[i]] === null) x[ks[i]] = {}; x = x[ks[i]]; } x[ks[ks.length - 1]] = v; };
const clone = o => JSON.parse(JSON.stringify(o == null ? null : o));

/* ---------- business constants ---------- */
const JTYPES = ['Ring','Pendant','Pendant with chain','Earrings','Necklace','Necklace set','Bracelet','Bangle / Kada','Mangalsutra','Nose pin','Chain','Other'];
const COLORS = ['Yellow Gold','Rose Gold','White Gold','Two-tone','Tri-colour'];
const PURITY = ['9KT','14KT','18KT','22KT','Silver','Platinum'];
const SHAPES = ['Mix','Round','Oval','Pear','Princess','Marquise','Emerald','Cushion','Heart','Baguette'];
const PAYMODES = ['UPI','Cash','Card','Bank transfer','Cheque','Old gold'];
const STAGES = [
  ['new','नया order (factory ने अभी नहीं देखा)'], ['received','Factory को मिला'], ['cad','CAD बन रहा'], ['cad_approval','CAD approval'],
  ['casting','Casting'], ['filing','Filing / Ghat'], ['setting','Diamond setting'], ['polish','Polish / Rhodium'],
  ['qc','QC / Hallmark'], ['ready','Dispatch के लिए ready'], ['dispatched','Dispatched']
];
const STAGE_SHORT = {new:'नया', received:'Factory को मिला', cad:'CAD', cad_approval:'CAD approval', casting:'Casting', filing:'Filing', setting:'Setting', polish:'Polish', qc:'QC / Hallmark', ready:'Ready', dispatched:'Dispatched'};
const stageIdx = k => STAGES.findIndex(s => s[0] === k);
const STATUS = {
  review: ['Approval बाकी', 'gold'], query: ['Query', 'bad'], factory: ['Factory में', 'ok'],
  dispatched: ['Dispatched', 'dark'], received: ['Store पर आया', 'ok2'], delivered: ['Delivered', 'mute'], cancelled: ['Cancelled', 'mute']
};
const ACTIVE = ['review','query','factory','dispatched','received'];
const ROLES = {admin: 'Admin', store: 'Store', factory: 'Factory'};
const TERMS = [
  'The jewellery will be produced exactly as per the approved reference.',
  'Minor variations in finishing, weight or handmade detailing may occur.',
  'Once production starts, the order cannot be cancelled.',
  'Advance amount paid is non-refundable.',
  'If gold rate is not booked, final billing will be as per market rate on delivery date.',
  'If you want to book gold rate then you have to pay at least 50% of estimated value.',
  'If product is as per the image or reference given by client then product will not be returned.'
];
/* Fields that are compared when an order is edited (path, label, where it lives) */
const EDIT_FIELDS = [
  ['client.name','Client का नाम','priv'], ['client.phone','Contact No.','priv'], ['client.city','City / Area','priv'],
  ['spec.jtype','Jewellery type','main'], ['spec.jtypeOther','Type (Other)','main'], ['spec.qty','Qty','main'],
  ['spec.metalColor','Metal colour','main'], ['spec.purity','Purity','main'], ['spec.size','Size / Length','main'],
  ['spec.dia1Ct','Dia Ct. 1','main'], ['spec.dia1Shape','Dia 1 shape','main'], ['spec.dia2Ct','Dia Ct. 2','main'], ['spec.dia2Shape','Dia 2 shape','main'],
  ['spec.gem1','Gemstone 1','main'], ['spec.gem2','Gemstone 2','main'], ['spec.engraving','Engraving','main'], ['spec.design','Design details','main'],
  ['deliveryDay','Client delivery date','main'], ['priority','Priority','main'],
  ['price.est','Est. Amount','priv'], ['price.goldRateBooked','Gold rate booked','priv'], ['price.goldRate','Booked gold rate','priv'],
  ['internalNote','Internal note','priv']
];
const LABEL = Object.fromEntries(EDIT_FIELDS.map(f => [f[0], f[1]]));

/* ---------- state ---------- */
const S = {
  authUser: null, me: null, users: {}, orders: {}, priv: {}, extra: {}, extraPriv: {}, history: null, histLoading: false,
  route: {v: 'loading'}, filter: 'all', q: '', firstOrders: true, unsubs: [], privUnsubs: {}, viewUnsubs: [], viewId: null,
  needSetup: false, settingUp: false, booted: false, micFor: null
};
const role = () => (S.me && S.me.role) || '';
const isAdmin = () => role() === 'admin';
const isStore = () => role() === 'store';
const isFactory = () => role() === 'factory';
const staff = () => isAdmin() || isStore();
const myName = () => (S.me && S.me.name) || '';
const getOrder = id => S.orders[id] || S.extra[id] || null;
const getPriv = id => S.priv[id] || S.extraPriv[id] || null;
const uname = uid => (S.users[uid] && S.users[uid].name) || '';

/* ---------- writes ---------- */
async function commit(p){
  let failed = false;
  const guarded = p.then(() => 'ok', e => { failed = true; handleWriteErr(e); return 'err'; });
  const r = await Promise.race([guarded, sleep(3000).then(() => 'queued')]);
  if (r === 'queued' && !failed) toast('Internet धीमा है. बदलाव phone में save है, Internet आते ही sync होगा.');
  return r !== 'err';
}
const write = (path, data) => commit(B.db.update(path, data));
const batch = ops => commit(B.db.batch(ops));
function errText(e){
  const c = (e && e.code) || '';
  if (/permission-denied|unauthorized/.test(c)) return 'Permission नहीं है. (Firebase rules ठीक से paste हुए हैं, ये देखें.)';
  if (/unavailable|failed-precondition|network/.test(c)) return 'Internet नहीं है. Internet चालू करके दोबारा कोशिश करें.';
  if (/quota|resource-exhausted/.test(c)) return 'Firebase की सीमा पूरी हो गई है.';
  return 'कुछ गड़बड़ हुई (' + (c || (e && e.message) || 'error') + '). दोबारा कोशिश करें.';
}
function handleWriteErr(e){ console.error(e); toast('Save नहीं हुआ — ' + errText(e), 'bad'); }
function logEntry(type, text, extra){
  return Object.assign({at: Date.now(), by: S.authUser.uid, name: myName(), role: role(), type, text: text || ''}, extra || {});
}
const logKey = () => 'k' + Date.now() + Math.random().toString(36).slice(2, 6);
function stamp(o){ o.updatedAt = Date.now(); o.updatedBy = S.authUser.uid; return o; }

/* ---------- alerts ---------- */
let actx = null;
document.addEventListener('pointerdown', () => {
  try { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); else if (actx.state === 'suspended') actx.resume().catch(() => {}); } catch (e) {}
}, {passive: true});
function chime(){
  try {
    if (navigator.vibrate) navigator.vibrate([120, 60, 120]);
    if (!actx || actx.state !== 'running') return;
    const t0 = actx.currentTime;
    [988, 1319].forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain(), s = t0 + i * 0.13;
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, s); g.gain.exponentialRampToValueAtTime(0.12, s + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, s + 0.35);
      o.connect(g); g.connect(actx.destination); o.start(s); o.stop(s + 0.4);
    });
  } catch (e) {}
}
function systemNotify(title, body){
  if (NATIVE || !('Notification' in window) || Notification.permission !== 'granted') return;
  const opts = {body, icon: 'icons/icon-192.png', badge: 'icons/icon-192.png', tag: 'do-' + Date.now(), lang: 'hi'};
  const fallback = () => { try { new Notification(title, opts); } catch (e) {} };
  if (navigator.serviceWorker && navigator.serviceWorker.getRegistration) navigator.serviceWorker.getRegistration().then(r => r ? r.showNotification(title, opts) : fallback()).catch(fallback);
  else fallback();
}
function alertUser(title, body){
  toast(title + ': ' + body);
  chime();
  let bg = document.hidden;
  try { if (NATIVE && NATIVE.isForeground && !NATIVE.isForeground()) bg = true; } catch (e) {}
  if (!bg) return;
  if (NATIVE && NATIVE.notifyUser) { try { NATIVE.notifyUser(title, body); } catch (e) {} }
  else systemNotify(title, body);
}
function toast(msg, kind){
  const el = document.createElement('div');
  el.className = 'toast ' + (kind || ''); el.textContent = msg;
  const box = $('#toasts'); box.appendChild(el);
  while (box.children.length > 3) box.firstElementChild.remove();
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 320); }, 4800);
}

/* ---------- render plumbing ---------- */
let rq = false;
function render(){ if (rq) return; rq = true; requestAnimationFrame(() => { rq = false; try { doRender(); } catch (e) { console.error(e); } }); }
function patch(el, html){
  if (!el || el._h === html) return;
  const keep = {};
  el.querySelectorAll('textarea[id],input[id],select[id]').forEach(i => { if (i.type !== 'checkbox' && i.type !== 'radio' && i.type !== 'file') keep[i.id] = i.value; });
  const act = document.activeElement;
  const aid = act && el.contains(act) ? act.id : null;
  let sel = null; if (aid) { try { sel = [act.selectionStart, act.selectionEnd]; } catch (e) {} }
  const media = {};
  el.querySelectorAll('audio[id],video[id]').forEach(m => { if (!m.paused) media[m.id] = m; });
  el.innerHTML = html; el._h = html;
  for (const id in keep) { const i = el.querySelector('#' + CSS.escape(id)); if (i) i.value = keep[id]; }
  for (const id in media) { const n = el.querySelector('#' + CSS.escape(id)); if (n) n.replaceWith(media[id]); }
  if (aid) { const n = el.querySelector('#' + CSS.escape(aid)); if (n) { n.focus({preventScroll: true}); if (sel && sel[0] != null) { try { n.setSelectionRange(sel[0], sel[1]); } catch (e) {} } } }
}
function parseRoute(){
  const h = (location.hash || '#/').replace(/^#/, '');
  const p = h.split('/').filter(Boolean);
  if (p[0] === 'o' && p[1]) return {v: 'order', id: p[1]};
  if (p[0] === 'new') return {v: 'form', mode: 'new'};
  if (p[0] === 'edit' && p[1]) return {v: 'form', mode: 'edit', id: p[1]};
  if (p[0] === 'team') return {v: 'team'};
  if (p[0] === 'account') return {v: 'account'};
  return {v: 'home'};
}
const go = h => { if (location.hash === h) { S.route = parseRoute(); render(); } else location.hash = h; };

function doRender(){
  const view = $('#view');
  const logged = !!(S.authUser && S.me);
  $('#top').hidden = !logged;
  $('#tabs').hidden = !logged;
  if (!S.booted) return;
  if (!S.authUser) {
    $('#stickbar').innerHTML = '';
    if (S.needSetup) { if (S.route.v !== 'setup') { S.route = {v: 'setup'}; renderSetup(); } return; }
    if (S.route.v !== 'login') { S.route = {v: 'login'}; renderLogin(); }
    return;
  }
  if (!S.me) { patch(view, '<div class="splash"><div><img src="icons/mark.png" alt=""><p>Account खुल रहा है…</p></div></div>'); return; }
  renderTop();
  const r = S.route;
  if (r.v !== 'form') closeFormIfOpen();
  if (r.v === 'order') { watchView(r.id); renderOrder(r.id); }
  else { watchView(null); }
  if (r.v === 'home') renderHome();
  else if (r.v === 'form') renderFormRoute(r);
  else if (r.v === 'team') { if (!isAdmin()) return go('#/'); renderTeam(); }
  else if (r.v === 'account') renderAccount();
  if (r.v !== 'order' && r.v !== 'form') $('#stickbar').innerHTML = '';
}

/* ---------- top & tabs ---------- */
function attentionCount(){
  const r = role(); let n = 0;
  for (const id in S.orders) {
    const o = S.orders[id];
    if (r === 'admin' && (o.status === 'review' || o.stage === 'cad_approval')) n++;

/* ---------- session & listeners ---------- */
function stopAll(){

let dataStarted = false;
function startSession(u){
  S.authUser = u;
  const unsubMe = B.db.watchDoc('users/' + u.uid, snap => {
    if (!snap.exists || !snap.data.active) {
      if (S.settingUp) return;

function startData(){
  S.unsubs.push(B.db.watchQuery('users', [], list => { S.users = Object.fromEntries(list.map(x => [x.id, x.data])); render(); }, e => console.error(e)));
  const onErr = e => { console.error(e); toast('Orders load नहीं हुए — ' + errText(e), 'bad'); };
  if (isFactory()) {
    /* two-field query; if Firebase still builds its index, fall back to one field + filter here */
    let cur = null;
    const subscribe = (filters, keep) => {
      cur = B.db.watchQuery('orders', filters, list => onOrders(keep ? list.filter(keep) : list), e => {
        if (filters.length > 1 && /failed-precondition/.test((e && e.code) || '')) subscribe([['factoryVisible', '==', true]], x => ['factory', 'dispatched'].includes(x.data.status));
        else onErr(e);
      });
    };
    subscribe([['factoryVisible', '==', true], ['status', 'in', ['factory', 'dispatched']]]);
    S.unsubs.push(() => { try { if (cur) cur(); } catch (e) {} });
  } else {
    S.unsubs.push(B.db.watchQuery('orders', [['status', 'in', ACTIVE]], onOrders, onErr));
  }
}
function onOrders(list){
  const next = {}; list.forEach(x => { next[x.id] = x.data; });
  if (!S.firstOrders) detectEvents(S.orders, next);
  /* an order that just left the live list (delivered / cancelled) stays on screen until its own watch takes over */
  const v = S.viewId;
  if (v && S.orders[v] && !next[v]) { S.extra[v] = S.orders[v]; if (S.priv[v]) S.extraPriv[v] = S.priv[v]; }
  S.orders = next; S.firstOrders = false;
  syncPriv(); render();
}
function syncPriv(){
  if (!staff()) return;
  for (const id in S.orders) {
    if (S.privUnsubs[id]) continue;
    S.privUnsubs[id] = B.db.watchDoc('orders/' + id + '/private/info', s => { S.priv[id] = s.exists ? s.data : null; render(); }, e => console.error(e));
  }
  for (const id in S.privUnsubs) {
    if (!S.orders[id]) { try { S.privUnsubs[id](); } catch (e) {} delete S.privUnsubs[id]; delete S.priv[id]; }
  }
}
function watchView(id){
  if (S.viewId !== id) { S.viewUnsubs.forEach(u => { try { u(); } catch (e) {} }); S.viewUnsubs = []; S.viewId = id; }
  if (!id || S.orders[id] || S.viewUnsubs.length) return;
  S.viewUnsubs.push(B.db.watchDoc('orders/' + id, s => { if (s.exists) S.extra[id] = s.data; else S.extra[id] = {missing: true}; render(); }, e => { S.extra[id] = {missing: true, err: errText(e)}; render(); }));
  if (staff()) S.viewUnsubs.push(B.db.watchDoc('orders/' + id + '/private/info', s => { S.extraPriv[id] = s.exists ? s.data : null; render(); }, () => {}));

function detectEvents(prev, next){
  const r = role(), me = S.authUser.uid, evs = [];
  for (const id in next) {
    const n = next[id], o = prev[id];
    if (n.updatedBy === me) continue;
    if (!o) {
      if (r === 'admin' && n.status === 'review') evs.push(['नया Order', n.no + ' — ' + itemLine(n)]);
      if (r === 'factory') evs.push(['नया Order आया', n.no + ' — ' + itemLine(n)]);
      continue;
    }
    if (o.status !== n.status) {
      if (n.status === 'query' && r === 'store') evs.push(['Query आई', n.no + ': ' + ((n.query && n.query.text) || '')]);
      if (n.status === 'review' && o.status === 'query' && r === 'admin') evs.push(['Query का जवाब आया', n.no]);
      if (n.status === 'factory' && o.status !== 'factory' && r === 'store') evs.push(['Approve हो गया', n.no + ' factory को चला गया']);
      if (n.status === 'dispatched' && r !== 'factory') evs.push(['Dispatched', n.no + ' factory से निकल गया']);
      continue;
    }
    if (o.stage !== n.stage && n.stage === 'cad_approval' && r !== 'factory') evs.push(['CAD approval चाहिए', n.no]);
    if (r === 'factory' && o.factoryAck !== false && n.factoryAck === false) evs.push(['Order में बदलाव', n.no + ' — details देखें']);
    if (r === 'factory' && o.stage === 'cad_approval' && n.stage !== o.stage) evs.push([n.stage === 'cad' ? 'CAD में बदलाव चाहिए' : 'CAD OK हो गया', n.no]);
  }
  evs.slice(0, 3).forEach(e => alertUser(e[0], e[1]));
}

/* ---------- order helpers ---------- */
function jtypeOf(s){ s = s || {}; return s.jtype === 'Other' ? (s.jtypeOther || 'Other') : (s.jtype || ''); }
function itemLine(o){
  const s = (o && o.spec) || {};
  const parts = [jtypeOf(s), [s.purity, s.metalColor].filter(Boolean).join(' ')];
  if (s.dia1Ct && s.dia1Ct !== 'NA') parts.push('Dia ' + s.dia1Ct + 'ct' + (s.dia1Shape ? ' ' + s.dia1Shape : ''));
  if (s.size && s.size !== 'NA') parts.push(s.size);
  return parts.filter(Boolean).join(' · ');
}
function dueChip(day, doneAt){
  if (!day) return '';
  if (doneAt) {
    const late = diffDays(dayOf(new Date(doneAt)), day);
    return late > 0 ? `<span class="cnt bad">${late} दिन late</span>` : `<span class="cnt ok">समय पर ✓</span>`;
  }
  const d = diffDays(day, today());
  if (d < 0) return `<span class="cnt bad"><b>${-d}</b> दिन late</span>`;
  if (d === 0) return `<span class="cnt bad">आज due</span>`;
  if (d <= 2) return `<span class="cnt warn"><b>${d}</b> दिन बाकी</span>`;
  if (d <= 5) return `<span class="cnt gold"><b>${d}</b> दिन बाकी</span>`;
  return `<span class="cnt ok"><b>${d}</b> दिन बाकी</span>`;
}
function dispatchedAt(o){ return o.dispatch && o.dispatch.at; }
function isLate(o){
  const day = isFactory() ? o.factoryDue : (o.status === 'factory' ? (o.factoryDue || o.deliveryDay) : o.deliveryDay);
  if (!day) return false;
  if (['dispatched','received','delivered','cancelled'].includes(o.status)) return false;
  return diffDays(day, today()) < 0;
}
function stagePct(o){
  if (['dispatched','received','delivered'].includes(o.status)) return 100;
  if (o.status !== 'factory') return 0;
  const i = Math.max(0, stageIdx(o.stage));
  return Math.round(i / (STAGES.length - 1) * 100);
}
function statusPill(o){ const s = STATUS[o.status] || [o.status, 'mute']; return `<span class="pill ${s[1]}">${esc(s[0])}</span>`; }
function mediaList(map){ return Object.entries(map || {}).map(([id, m]) => Object.assign({id}, m)).filter(m => !m.deleted && m.url).sort((a, b) => (a.at || 0) - (b.at || 0)); }
function paidTotal(p){ return Object.values((p && p.payments) || {}).filter(x => !x.deleted).reduce((a, x) => a + num(x.amount), 0); }
function waLink(phone, text){ const p = phone10(phone); return 'https://wa.me/' + (p ? '91' + p : '') + '?text=' + encodeURIComponent(text); }
function appLink(id){ return location.origin + location.pathname + '#/o/' + id; }
function usersWith(r){ return Object.entries(S.users).filter(([, u]) => u.active && u.role === r).map(([uid, u]) => Object.assign({uid}, u)); }

/* ---------- home ---------- */
function homeFilters(){
  if (isFactory()) return [
    ['all', 'सभी', () => true],
    ['new', 'नए / बदलाव', o => o.status === 'factory' && (o.stage === 'new' || o.factoryAck === false)],
    ['work', 'काम चल रहा', o => o.status === 'factory' && o.stage !== 'new'],
    ['cad', 'CAD approval', o => o.stage === 'cad_approval'],
    ['late', 'Late', o => isLate(o)],
    ['disp', 'Dispatched', o => o.status === 'dispatched']
  ];
  return [
    ['all', 'सभी', () => true],
    ['review', 'Approval बाकी', o => o.status === 'review'],
    ['query', 'Query', o => o.status === 'query'],
    ['factory', 'Factory में', o => o.status === 'factory'],
    ['cad', 'CAD approval', o => o.stage === 'cad_approval' && o.status === 'factory'],
    ['late', 'Late', o => isLate(o)],
    ['disp', 'Dispatched', o => o.status === 'dispatched' || o.status === 'received']

}
function needsMe(o){
  const r = role();
  if (r === 'admin') return o.status === 'review' || (o.status === 'factory' && o.stage === 'cad_approval');
  if (r === 'store') return o.status === 'query' || (o.status === 'factory' && o.stage === 'cad_approval') || o.status === 'dispatched';
  return o.status === 'factory' && (o.stage === 'new' || o.factoryAck === false);

function sortKey(o){

function orderCard(id, o, p){

  const day = isFactory() ? o.factoryDue : (o.status === 'factory' ? (o.factoryDue || o.deliveryDay) : o.deliveryDay);

const MAX_VIDEO = 300 * 1024 * 1024;
function compressImage(file){
  return new Promise(resolve => {
    if (!/^image\/(jpeg|png|webp|heic|heif)/.test(file.type) || file.size < 350 * 1024) return resolve(file);
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const max = 1800, sc = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas');
      c.width = Math.round(img.naturalWidth * sc); c.height = Math.round(img.naturalHeight * sc);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob(b => resolve(b && b.size < file.size ? b : file), 'image/jpeg', 0.84);
    };
    img.onerror = () => { URL.revokeObjectURL(url); resolve(file); };
    img.src = url;
  });
}
const extOf = (type, name) => {
  const m = /\.([a-z0-9]{2,5})$/i.exec(name || ''); if (m) return m[1].toLowerCase();
  if (/jpeg/.test(type)) return 'jpg'; if (/png/.test(type)) return 'png'; if (/webm/.test(type)) return 'webm'; if (/mp4/.test(type)) return /audio/.test(type) ? 'm4a' : 'mp4'; if (/ogg/.test(type)) return 'ogg';
  return 'bin';
};
function makePicker(containerId, orderId, opts){

  P.done = () => Object.values(items).filter(m => m.status === 'ok').map(m => {
    const d = {kind: m.kind, url: m.url, path: m.path, desc: (m.desc || '').trim(), by: m.by || S.authUser.uid, byName: m.byName || myName(), at: m.at, size: m.size || 0};
    if (opts.stage && opts.stage()) d.stage = opts.stage();
    if (opts.allowInternal) d.factory = m.factory !== false;
    return Object.assign({id: m.id}, d);
  });
  P.load = list => { (list || []).forEach(m => { items[m.id] = Object.assign({status: 'ok', progress: 1, existing: true}, m); }); };
  P.render = () => {
    const box = el(); if (!box) return;
    const list = Object.values(items).sort((a, b) => a.at - b.at);
    let h = `<div class="mbtns">

    h += list.map(m => {
      let th = '';
      if (m.kind === 'image') th = m.preview || m.url ? `<img src="${esc(m.preview || m.url)}" alt="">` : '🖼️';
      else if (m.kind === 'video') th = '🎬';
      else th = '🎙️';
      const pr = m.status === 'up' ? `<span class="pr"><i style="width:${Math.round((m.progress || 0) * 100)}%"></i></span>` : '';
      const state = m.status === 'up' ? `Upload ${Math.round((m.progress || 0) * 100)}%…` : m.status === 'err' ? '<span style="color:var(--bad)">Upload नहीं हुआ</span>' : '✓ Upload';
      return `<div class="mitem"><div class="mthumb">${th}${pr}</div><div class="mbody">

  const end = () => { if (drawing) { drawing = false; const w = $('#w-sig'); if (w) w.classList.remove('miss'); renderFormBar(); } };

async function saveEdit(){
  const id = F.id, o = F.orig.o, p = F.orig.p;
  const fresh = getOrder(id);
  if (!canEdit(fresh)) { toast('ये order अब edit नहीं हो सकता.', 'bad'); return go('#/o/' + id); }
  const main = {}, priv = {}, mainTxt = [], privTxt = [], edited = {};
  const cur = {client: F.client, spec: F.spec, deliveryDay: F.deliveryDay, priority: F.priority, price: F.price, internalNote: F.internalNote};
  const oldAll = {client: p.client || {}, spec: o.spec || {}, deliveryDay: o.deliveryDay, priority: o.priority, price: p.price || {}, internalNote: p.internalNote || ''};
  for (const [path, label, where] of EDIT_FIELDS) {
    if (!staff() && where === 'priv') continue;
    let nv = get(cur, path); let ov = get(oldAll, path);
    nv = nv == null ? '' : String(nv).trim(); ov = ov == null ? '' : String(ov).trim();
    if (path === 'client.phone') nv = phone10(nv);
    if (path === 'price.est' || path === 'price.goldRate') { nv = nv === '' ? '' : String(num(nv)); ov = ov === '' ? '' : String(num(ov)); }
    if (nv === ov) continue;
    const val = (path === 'price.est' || path === 'price.goldRate') ? (nv === '' ? '' : num(nv)) : nv;
    const line = label + ': ' + (ov || '—') + ' → ' + (nv || '—');
    if (where === 'main') { setp(main, path, val); mainTxt.push(line); edited[path.replace(/\./g, '_')] = Date.now(); }
    else { setp(priv, path, val); privTxt.push(line); }
  }
  /* calc */
  const CALC_IN = ['goldWt', 'goldRate', 'diaRate', 'dia2Rate', 'gemAmt', 'making', 'other', 'gst'];
  const calcSig = c => c && num(c.final) ? CALC_IN.map(k => String(num(c[k]))).join('|') + '|' + Math.round(num(c.final)) : '';
  const nvCalc = calcValues(F.price.calc, F.spec).value ? Object.assign(clone(F.price.calc), calcValues(F.price.calc, F.spec)) : null;
  if (calcSig(nvCalc) !== calcSig((p.price || {}).calc)) { priv.price = priv.price || {}; priv.price.calc = nvCalc; if (!privTxt.length) privTxt.push('हिसाब (calculation) बदला'); }
  /* media: new, removed, moved */
  const nowMedia = FP.done();
  const oldF = o.media || {}, oldP = p.media || {};
  let mAdd = 0, mDel = 0;
  nowMedia.forEach(m => {
    const d = Object.assign({}, m); const f = d.factory !== false; delete d.factory; delete d.id;
    const inF = oldF[m.id] && !oldF[m.id].deleted, inP = oldP[m.id] && !oldP[m.id].deleted;
    if (f && !inF) { setp(main, 'media.' + m.id, d); if (inP) setp(priv, 'media.' + m.id + '.deleted', true); else mAdd++; }
    if (!f && !inP) { setp(priv, 'media.' + m.id, d); if (inF) setp(main, 'media.' + m.id + '.deleted', true); else mAdd++; }
    if (f && inF && (oldF[m.id].desc || '') !== d.desc) setp(main, 'media.' + m.id + '.desc', d.desc);
    if (!f && inP && (oldP[m.id].desc || '') !== d.desc) setp(priv, 'media.' + m.id + '.desc', d.desc);
  });
  const ids = new Set(nowMedia.map(m => m.id));
  Object.keys(oldF).forEach(k => { if (!oldF[k].deleted && !ids.has(k)) { setp(main, 'media.' + k + '.deleted', true); mDel++; } });
  Object.keys(oldP).forEach(k => { if (!oldP[k].deleted && !ids.has(k)) { setp(priv, 'media.' + k + '.deleted', true); mDel++; } });
  if (mAdd) mainTxt.push(mAdd + ' नई photo/video/voice जोड़ी');
  if (mDel) mainTxt.push(mDel + ' photo/video हटाई');
  if (!Object.keys(main).length && !Object.keys(priv).length) { toast('कुछ नहीं बदला.'); return go('#/o/' + id); }
  const ops = [];
  if (Object.keys(main).length || mainTxt.length) {
    main.log = {[logKey()]: logEntry('edited', 'बदलाव:\n' + (mainTxt.join('\n') || 'Details update'))};
    if (Object.keys(edited).length) main.edited = edited;
    if (fresh.status === 'factory' && mainTxt.length) main.factoryAck = false;
    ops.push({op: 'update', path: 'orders/' + id, data: stamp(main)});
  }
  if (Object.keys(priv).length) {
    if (privTxt.length) priv.log = {[logKey()]: logEntry('price', 'बदलाव:\n' + privTxt.join('\n'))};
    ops.push({op: 'update', path: 'orders/' + id + '/private/info', data: priv});
  }
  const ok = await batch(ops);
  if (!ok) return;
  FORMKEY = null; F = null; FP = null;
  toast('बदलाव save हो गए.' + (fresh.status === 'factory' && mainTxt.length ? ' Factory को alert चला गया.' : ''));
  go('#/o/' + id);
}

  openSheet('Login बन गया', `<div class="cred">नाम: <b>${esc(name)}</b><br>Login ID: <b>${esc(lid)}</b><br>Password: <b>${esc(pw)}</b></div>
    <p class="small muted">ये details अभी भेज दें — password बाद में दोबारा नहीं दिखेगा.</p>
    <div class="btns">${phone ? `<a class="btn wa" target="_blank" rel="noopener" href="${esc(waLink(phone, credText(name, lid, pw)))}">WhatsApp पर भेजें</a>` : ''}<button class="btn" data-act="copy" data-t="${esc(credText(name, lid, pw))}">Copy करें</button></div>
    <button class="btn big" style="margin-top:12px" data-act="sheet-close">ठीक है</button>`, {});
}
function userMenu(uid){
  const u = S.users[uid];
  openSheet(u.name, `<div class="fld"><label for="um-phone">WhatsApp नंबर</label><div class="inp"><input id="um-phone" type="tel" inputmode="numeric" value="${esc(u.phone || '')}"><button class="btn sm" data-act="um-phone" style="flex:none">Save</button></div></div>
    <div class="lbl">Role</div><div class="chips" id="um-role" style="margin-bottom:8px">${Object.entries(ROLES).map(([k, v]) => `<button class="chip ${u.role === k ? 'on' : ''}" data-act="um-role" data-v="${k}">${v}</button>`).join('')}</div>
    <div class="btns" style="margin-top:14px"><button class="btn" data-act="um-newpw">🔑 नया Password बनाएँ</button><button class="btn danger" data-act="um-off">Login बंद करें</button></div>`, {uid});
}
async function userNewPw(){
  const uid = S.sheet.uid, u = S.users[uid];
  const pw = prompt('नया password (कम से कम 6 अक्षर):');
  if (!pw) return; if (pw.length < 6) return toast('Password कम से कम 6 अक्षर.', 'bad');
  try {
    const email = (u.loginId || 'user').replace(/[^a-z0-9]/g, '') + '-' + Math.random().toString(36).slice(2, 7) + '@' + (B.projectId || 'deeva-orders') + '.firebaseapp.com';
    const nuid = await B.auth.createUser(email, pw);
    await B.db.batch([
      {op: 'set', path: 'users/' + nuid, data: Object.assign({}, u, {active: true, at: Date.now(), by: S.authUser.uid, prevUid: uid})},
      {op: 'update', path: 'users/' + uid, data: {active: false, replacedBy: nuid}},
      {op: 'set', path: 'logins/' + u.loginId, data: {email, uid: nuid, at: Date.now()}}
    ]);
    showCred(u.name, u.loginId, pw, u.phone);
  } catch (e) { toast(authErr(e), 'bad'); }
}

/* ---------- account ---------- */
function notifLater(){ try { return localStorage.getItem('do.notif.later') === '1'; } catch (e) { return false; } }
function renderAccount(){
  const lang = micLang();
  let h = `<div class="view-title">मेरा Account</div>
  <div class="card"><div class="row"><span class="who" style="pointer-events:none;background:var(--g8)"><span class="av">${esc(initial(myName()))}</span><span>${esc(myName())}</span><em>${esc(ROLES[role()])}</em></span></div>
    <p class="small muted" style="margin:10px 0 0">Login ID: ${esc((S.me && S.me.loginId) || '')}</p></div>
  <div class="card"><h3>🎤 बोलकर लिखने की भाषा</h3><div class="chips">${[['hi-IN','हिंदी'],['en-IN','English (India)']].map(x => `<button class="chip ${lang === x[0] ? 'on' : ''}" data-act="mic-lang" data-v="${x[0]}">${x[1]}</button>`).join('')}</div>
    <p class="small muted" style="margin:8px 0 0">हिंदी चुनने पर भी "rose gold", "pendant" जैसे English शब्द ठीक लिखे जाते हैं.</p></div>
  <div class="card"><h3>🔑 Password बदलें</h3><div class="err" id="pw-err" hidden></div>
    <div class="fld"><label for="pw-cur">अभी का password</label><input class="in" id="pw-cur" type="password" autocomplete="current-password"></div>
    <div class="fld"><label for="pw-new">नया password</label><input class="in" id="pw-new" type="password" autocomplete="new-password"></div>
    <button class="btn" data-act="pw-change">Password बदलें</button></div>`;
  if (!NATIVE && 'Notification' in window) h += `<div class="card"><h3>🔔 Notification</h3><p class="small muted" style="margin-top:0">${Notification.permission === 'granted' ? 'चालू है — app खुला या background में हो तो alert आएगा.' : 'नए order / update पर phone में alert के लिए चालू करें.'}</p>${Notification.permission !== 'granted' ? '<button class="btn" data-act="notif-on">चालू करें</button>' : ''}</div>`;
  h += `<button class="btn big danger" data-act="logout">Logout</button>`;
  patch($('#view'), h);
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t) return;
  const a = t.dataset.act;
  const oid = S.route && S.route.id;
  switch (a) {
    case 'go': e.preventDefault(); go(t.dataset.to); break;
    case 'logout': logout(); break;
    case 'reset-pw': sendResetLink(); break;
    case 'filter': S.filter = t.dataset.v; render(); break;
    case 'hist-load': loadHistory(); break;
    case 'notif-on': if ('Notification' in window) Notification.requestPermission().then(() => render()); break;
    case 'notif-later': try { localStorage.setItem('do.notif.later', '1'); } catch (x) {} render(); break;
    case 'sheet-close': closeSheet(); break;
    case 'sheet-bg': if (e.target === t) closeSheet(); break;
    case 'zoom': {
      const lb = document.createElement('div'); lb.className = 'lightbox';
      lb.innerHTML = `<div><img src="${esc(t.dataset.src)}" alt="">${t.dataset.cap ? `<p>${esc(t.dataset.cap)}</p>` : ''}</div><button aria-label="बंद करें">✕</button>`;
      lb.addEventListener('click', () => lb.remove()); document.body.appendChild(lb); break;
    }
    case 'mic': e.preventDefault(); micStart(t.dataset.for, t); break;
    case 'chip': e.preventDefault(); onChip(t); break;
    case 'pick1': {
      e.preventDefault();
      $$('#' + t.dataset.g + ' .chip').forEach(c => c.classList.toggle('on', c === t));
      if (S.sheet && (t.dataset.g === 'dp-mode' || t.dataset.g === 'py-mode')) S.sheet.mode = t.dataset.v;
      break;
    }
    case 'f-days': if (F) { const d = addDays(today(), +t.dataset.n); const i = $('#f-deliveryDay'); i.value = d; onFormInput(i); } break;
    case 'calc-toggle': { const c = $('#calc'); c.hidden = !c.hidden; if (!c.hidden) updateCalc(); break; }
    case 'calc-apply': { const v = calcValues(F.price.calc, F.spec); if (!v.final) return toast('पहले weight और rate डालें.', 'bad'); const i = $('#f-price-est'); i.value = String(Math.round(v.final)); onFormInput(i); toast('Est. Amount: ' + money(v.final)); break; }
    case 'sig-clear': clearSig(); break;
    case 'f-clear': if (confirm('ये अधूरा order मिटाकर नया शुरू करें?')) { clearDraft(); FORMKEY = null; F = null; render(); } break;
    case 'f-review': reviewForm(); break;
    case 'f-submit': submitNew(); break;
    case 'goto-field': gotoField(t.dataset.p); break;
    case 'rec': e.preventDefault(); { const p = PICKERS[t.dataset.p]; if (p) p.toggleRec(); } break;
    case 'mdel': e.preventDefault(); { const p = PICKERS[t.dataset.p]; if (p) p.del(t.dataset.id); } break;
    case 'approve-open': sheetApprove(oid); break;
    case 'approve-do': doApprove(); break;
    case 'query-open': sheetQuery(oid); break;
    case 'query-do': doQuery(); break;
    case 'reply-open': sheetReply(oid); break;
    case 'reply-do': doReply(); break;
    case 'stage-open': sheetStage(oid); break;
    case 'stage-pick': if (S.sheet) { S.sheet.stage = t.dataset.k; $$('#st-chips .chip').forEach(c => c.classList.toggle('on', c === t)); } break;
    case 'stage-do': doStage(); break;
    case 'stage-quick': setStage(oid, t.dataset.k, '', []).then(ok => { if (ok) toast('Stage: ' + STAGE_SHORT[t.dataset.k]); }); break;
    case 'cad-ok': if (confirm('CAD OK करें? Factory casting शुरू करेगा.')) doCad(true); break;
    case 'cad-change-open': openSheet('CAD में क्या बदलना है?', `<div class="fld">${textArea('cad-text', 'जैसे: flower थोड़ा छोटा, butterfly हटाओ', '')}</div><button class="btn primary big" data-act="cad-change-do">Factory को भेजें</button>`, {id: oid}); break;
    case 'cad-change-do': doCad(false); break;
    case 'note-open': sheetNote(oid); break;
    case 'note-do': doNote(); break;
    case 'dispatch-open': sheetDispatch(oid); break;
    case 'dispatch-do': doDispatch(); break;
    case 'recv': doReceived(); break;
    case 'deliv-open': sheetDelivered(oid); break;
    case 'deliv-do': doDelivered(); break;
    case 'pay-open': sheetPay(oid); break;
    case 'pay-do': doPay(); break;
    case 'final-open': sheetFinal(oid); break;
    case 'final-do': doFinal(); break;
    case 'cancel-open': sheetCancel(oid); break;
    case 'cancel-do': doCancel(); break;
    case 'reopen': doReopen(); break;
    case 'seen': doSeen(); break;
    case 'u-add': addUser(); break;
    case 'u-menu': userMenu(t.dataset.uid); break;
    case 'um-phone': write('users/' + S.sheet.uid, {phone: phone10($('#um-phone').value)}).then(ok => ok && toast('Save हो गया.')); break;
    case 'um-role': { const v = t.dataset.v; if (confirm(S.users[S.sheet.uid].name + ' का role "' + ROLES[v] + '" करें?')) write('users/' + S.sheet.uid, {role: v}).then(ok => { if (ok) { $$('#um-role .chip').forEach(c => c.classList.toggle('on', c === t)); toast('Role बदल गया.'); } }); break; }
    case 'um-newpw': userNewPw(); break;
    case 'um-off': if (confirm(S.users[S.sheet.uid].name + ' का login बंद करें? वो अब app नहीं खोल पाएँगे.')) write('users/' + S.sheet.uid, {active: false}).then(ok => { if (ok) { closeSheet(); toast('Login बंद कर दिया.'); } }); break;
    case 'copy': { const tx = t.dataset.t; if (NATIVE && NATIVE.copy) NATIVE.copy(tx); else if (navigator.clipboard) navigator.clipboard.writeText(tx).catch(() => {}); toast('Copy हो गया.'); break; }
    case 'mic-lang': write('users/' + S.authUser.uid, {micLang: t.dataset.v}).then(ok => ok && toast('भाषा बदल गई.')); break;
    case 'pw-change': {
      const cur = $('#pw-cur').value, nw = $('#pw-new').value;
      if (nw.length < 6) { showErr('#pw-err', 'नया password कम से कम 6 अक्षर.'); break; }
      B.auth.changePassword(cur, nw).then(() => { showErr('#pw-err', ''); $('#pw-cur').value = ''; $('#pw-new').value = ''; toast('Password बदल गया.'); }, err => showErr('#pw-err', authErr(err)));
      break;
    }
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'q') { S.q = t.value; render(); return; }
  if (t.dataset && t.dataset.f && F && FORMKEY) { onFormInput(t); return; }
  if (t.dataset && t.dataset.desc) { const p = PICKERS[t.dataset.p]; if (p && p.items[t.dataset.desc]) { p.items[t.dataset.desc].desc = t.value; if (p.opts.onChange) p.opts.onChange(); } }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset && t.dataset.pick) {
    const p = PICKERS[t.dataset.p];
    if (p) Array.from(t.files || []).forEach(f => p.add(f, t.dataset.pick));
    t.value = '';
    return;
  }
  if (t.dataset && t.dataset.fact) { const p = PICKERS[t.dataset.p]; if (p && p.items[t.dataset.fact]) { p.items[t.dataset.fact].factory = t.checked; if (p.opts.onChange) p.opts.onChange(); } return; }
  if (t.id === 'f-ack' && F) { F.ack.accepted = t.checked; $('#w-f-ack').classList.remove('miss'); renderFormBar(); saveDraft(); }
  if (t.id === 'f-remote' && F) { F.ack.remote = t.checked; $('#w-sig').hidden = t.checked; renderFormBar(); saveDraft(); }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'setup-form') doSetup();
  if (e.target.id === 'login-form') doLogin();
});
window.addEventListener('hashchange', () => { closeSheet(); S.route = parseRoute(); render(); });
/* Android back button: close a dialog / photo first */
window.__doBack = () => {
  const lb = document.querySelector('.lightbox'); if (lb) { lb.remove(); return true; }
  if ($('#sheet .sheet')) { closeSheet(); return true; }
  return false;
};
function net(){ $('#net').hidden = navigator.onLine !== false; }
window.addEventListener('online', net); window.addEventListener('offline', net);

/* ---------- boot ---------- */
function boot(){
  net();
  if (!B) {
    $('#view').innerHTML = `<div class="auth"><div class="logo"><img src="icons/wordmark.png" alt="Deeva"></div><div class="card"><h3>Setup बाकी है</h3><p>App अभी Firebase से नहीं जुड़ा है (config खाली है) या Internet नहीं है.</p></div></div>`;
    return;
  }
  S.route = parseRoute();
  B.auth.onChange(async u => {
    if (u) {
      if (S.authUser && S.authUser.uid === u.uid) return;
      stopAll(); S.booted = true; startSession(u); S.route = parseRoute(); render(); return;
    }
    stopAll(); S.authUser = null;
    try { const a = await B.db.get('config/admin'); S.needSetup = !a.exists; } catch (e) { S.needSetup = false; }
    S.booted = true; S.route = {v: ''}; render();
  });
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
}
boot();
})();
</script>
</body>
</html>
