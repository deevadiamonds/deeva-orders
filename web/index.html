<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Deeva Orders</title>
<meta name="description" content="Deeva Diamonds — made-to-order jewellery orders: store, approval, factory tracking">
<meta name="theme-color" content="#0d3b25">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Deeva Orders">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;700&family=Montserrat:wght@500;600;700&family=Playfair+Display:wght@600;700&display=swap">
<style>
:root{
  --bg:#f4efe4; --card:#ffffff; --card2:#faf6ec; --ink:#1b2620; --ink2:#535e57; --line:#e2dac8; --line2:#cfc4aa;
  --g7:#0f5330; --g8:#0d3b25; --g9:#0a271b; --gold:#e7b150; --gold-ink:#875810; --gold-soft:#fbf0d6; --cream:#f6eedc;
  --ok:#17663b; --ok-soft:#e1f1e6; --warn:#8a4e00; --warn-soft:#fdebc9; --bad:#ad261c; --bad-soft:#fbe3df; --mute:#5f6660; --mute-soft:#ebe7dc;
  --shadow:0 1px 2px rgba(10,39,27,.06),0 6px 18px rgba(10,39,27,.07);
  --acc:#0f5330; --chart:#1d7f4b; --chart-wash:rgba(29,127,75,.1); --r:14px; --font:"Mukta","Montserrat",system-ui,sans-serif; --num:"Montserrat","Mukta",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b1510; --card:#13211a; --card2:#182a21; --ink:#efe9dc; --ink2:#b4bdb5; --line:#26392e; --line2:#34503f;
    --gold-ink:#f0c46e; --gold-soft:#3a2e14; --ok:#86d8a7; --ok-soft:#173a26; --warn:#f3b863; --warn-soft:#3b2a10;
    --bad:#ff9a8f; --bad-soft:#3d1a17; --mute:#aab2ab; --mute-soft:#1f2d25; --shadow:none; --acc:#e7b150; --chart:#bf8a2a; --chart-wash:rgba(191,138,42,.12); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
    --bg:#0b1510; --card:#13211a; --card2:#182a21; --ink:#efe9dc; --ink2:#b4bdb5; --line:#26392e; --line2:#34503f;
    --gold-ink:#f0c46e; --gold-soft:#3a2e14; --ok:#86d8a7; --ok-soft:#173a26; --warn:#f3b863; --warn-soft:#3b2a10;
    --bad:#ff9a8f; --bad-soft:#3d1a17; --mute:#aab2ab; --mute-soft:#1f2d25; --shadow:none; --acc:#e7b150; --chart:#bf8a2a; --chart-wash:rgba(191,138,42,.12); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
[hidden]{display:none!important}
img{max-width:100%}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:30;background:linear-gradient(120deg,var(--g7),var(--g9));color:var(--cream);padding:calc(env(safe-area-inset-top) + 8px) max(14px,env(safe-area-inset-right,0px)) 8px max(14px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:10px;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none;min-width:0}
.brand img{width:30px;height:auto;flex:none}
.brand b{font-family:"Playfair Display",Georgia,serif;font-weight:700;font-size:19px;letter-spacing:.2px;white-space:nowrap}
.brand small{display:block;font-family:var(--num);font-size:9.5px;letter-spacing:2.2px;color:var(--gold);font-weight:600;margin-top:-2px}
.top .sp{flex:1}
.who{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.08);border:1px solid rgba(231,177,80,.45);border-radius:999px;padding:4px 10px 4px 4px;cursor:pointer;color:var(--cream);max-width:52vw}
.who .av{width:26px;height:26px;border-radius:50%;background:var(--gold);color:var(--g9);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.who span{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who em{font-style:normal;font-size:11px;color:var(--gold);font-family:var(--num);font-weight:600}
.net{background:var(--warn-soft);color:var(--warn);text-align:center;font-size:13.5px;padding:5px 10px}

/* ---------- tabs ---------- */
.tabs{position:sticky;top:calc(env(safe-area-inset-top) + 50px);z-index:25;display:flex;gap:4px;background:var(--card);border-bottom:1px solid var(--line);padding:0 8px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;text-decoration:none;text-align:center;padding:11px 12px 9px;font-weight:600;font-size:15px;color:var(--ink2);border-bottom:3px solid transparent;white-space:nowrap}
.tab.on{color:var(--acc);border-bottom-color:var(--gold)}
.tab i{font-style:normal;display:inline-block;min-width:20px;padding:0 6px;margin-left:5px;border-radius:999px;background:var(--bad);color:#fff;font-size:12px;font-family:var(--num);line-height:20px}

main{max-width:680px;margin:0 auto;padding-block:14px 130px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.view-title{font-family:"Playfair Display",Georgia,serif;font-size:22px;margin:4px 2px 12px;font-weight:700}
.muted{color:var(--ink2)}
.small{font-size:13.5px}
.center{text-align:center}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}

/* ---------- cards & buttons ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}
.card h3 .tag{margin-left:auto}
.btn{appearance:none;border:1px solid var(--line2);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 14px;font-weight:600;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;min-height:44px;line-height:1.2}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--g7);border-color:var(--g7);color:var(--cream)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--g9)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--acc)}
.btn.big{width:100%;padding:14px;font-size:17px;border-radius:14px}
.btn.sm{min-height:34px;padding:6px 10px;font-size:14px;border-radius:10px}
.btn.wa{background:#1f8a4c;border-color:#1f8a4c;color:#fff}
.btn[disabled]{opacity:.55;pointer-events:none}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns .btn{flex:1 1 auto}

.pill{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:600;border-radius:999px;padding:2px 9px;white-space:nowrap;font-family:var(--font)}
.pill.gold{background:var(--gold-soft);color:var(--gold-ink)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.ok2{background:var(--ok-soft);color:var(--ok);border:1px solid var(--ok)}
.pill.dark{background:var(--g8);color:var(--cream)}
.pill.mute{background:var(--mute-soft);color:var(--mute)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}

.cnt{display:inline-flex;align-items:center;gap:5px;font-weight:700;font-size:13.5px;border-radius:9px;padding:3px 9px;font-family:var(--font);white-space:nowrap}
.cnt b{font-family:var(--num);font-size:15px}
.cnt.ok{background:var(--ok-soft);color:var(--ok)}
.cnt.gold{background:var(--gold-soft);color:var(--gold-ink)}
.cnt.warn{background:var(--warn-soft);color:var(--warn)}
.cnt.bad{background:var(--bad-soft);color:var(--bad)}
.cnt.mute{background:var(--mute-soft);color:var(--mute)}

/* ---------- home list ---------- */
.filters{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 10px;margin:0 -2px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fchip{flex:none;border:1px solid var(--line2);background:var(--card);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600;cursor:pointer;display:flex;gap:6px;align-items:center;color:var(--ink2)}
.fchip b{font-family:var(--num);font-size:12.5px;background:var(--mute-soft);color:var(--ink);border-radius:999px;padding:0 7px;line-height:20px}
.fchip.on{background:var(--g7);border-color:var(--g7);color:var(--cream)}
.fchip.on b{background:var(--gold);color:var(--g9)}
.fchip.alert b{background:var(--bad);color:#fff}
.search{width:100%;border:1px solid var(--line2);background:var(--card);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:15px}
.ocard{display:block;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 13px;margin-bottom:10px;position:relative}
.ocard.hot{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold-soft),var(--shadow)}
.oc-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ono{font-family:var(--num);font-weight:700;font-size:15px;letter-spacing:.3px;margin-right:auto}
.oc-name{font-weight:700;font-size:16.5px;margin-top:4px}
.oc-item{color:var(--ink2);font-size:14.5px;margin-top:1px}
.oc-foot{display:flex;align-items:center;gap:8px;margin-top:9px;flex-wrap:wrap}
.oc-stage{font-size:13.5px;font-weight:600;color:var(--ink2);display:flex;align-items:center;gap:6px;margin-right:auto}
.bar{display:inline-block;width:66px;height:6px;border-radius:9px;background:var(--mute-soft);overflow:hidden;vertical-align:middle}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--g7))}
.empty{text-align:center;color:var(--ink2);padding:34px 10px}
.empty b{display:block;font-size:17px;color:var(--ink);margin-bottom:4px}

/* ---------- forms ---------- */
.sec{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 14px 6px;margin-bottom:12px;box-shadow:var(--shadow)}
.sec-h{display:flex;align-items:center;gap:10px;margin:0 0 12px}
.sec-h .n{width:28px;height:28px;border-radius:50%;background:var(--g7);color:var(--gold);display:grid;place-items:center;font-family:var(--num);font-weight:700;font-size:14px;flex:none}
.sec-h b{font-size:17px}
.sec-h small{display:block;font-size:13px;color:var(--ink2);font-weight:400;line-height:1.3}
.fld{margin-bottom:13px}
.fld>label,.lbl{display:block;font-weight:600;font-size:14.5px;margin-bottom:5px}
.req{color:var(--bad);margin-left:2px}
.inp{display:flex;align-items:stretch;gap:6px}
.inp input,.inp textarea,.inp select,input.in,textarea.in,select.in{flex:1;min-width:0;width:100%;border:1px solid var(--line2);background:var(--card2);border-radius:11px;padding:10px 12px;font-size:16px;outline:none}
.inp textarea,textarea.in{min-height:84px;resize:vertical}
.inp input:focus,.inp textarea:focus,input.in:focus,textarea.in:focus,select.in:focus{border-color:var(--g7);box-shadow:0 0 0 3px rgba(15,83,48,.14)}
.fld.miss .inp input,.fld.miss .inp textarea,.fld.miss .chips,.fld.miss>input.in,.check.miss,#w-sig.miss .sig-wrap{outline:2px solid var(--bad);outline-offset:2px;border-radius:11px}
.hint{font-size:13px;color:var(--ink2);margin-top:4px}
.mic{flex:none;width:46px;border-radius:11px;border:1px solid var(--line2);background:var(--card);display:grid;place-items:center;cursor:pointer;font-size:19px}
.mic.on{background:var(--bad);border-color:var(--bad);color:#fff;animation:pulse 1.1s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(173,38,28,.45)}70%{box-shadow:0 0 0 10px rgba(173,38,28,0)}100%{box-shadow:0 0 0 0 rgba(173,38,28,0)}}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line2);background:var(--card2);border-radius:10px;padding:7px 12px;font-size:15px;cursor:pointer;font-weight:500;min-height:38px}
.chip.on{background:var(--g7);border-color:var(--g7);color:var(--cream);font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two .fld{min-width:0}
.check{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line2);border-radius:11px;background:var(--card2);cursor:pointer;margin-bottom:10px}
.check input{width:22px;height:22px;margin:1px 0 0;accent-color:var(--g7);flex:none}
.terms{margin:0 0 12px;padding:0;list-style:none;counter-reset:t}
.terms li{counter-increment:t;display:flex;gap:9px;font-size:14px;padding:6px 0;border-bottom:1px dashed var(--line)}
.terms li::before{content:counter(t);font-family:var(--num);font-weight:700;color:var(--gold-ink);min-width:16px}
.sig-wrap{position:relative;border:1.5px dashed var(--line2);border-radius:12px;background:#fff;touch-action:none;margin-bottom:6px}
.sig-wrap canvas{display:block;width:100%;height:170px;border-radius:12px}
.sig-wrap span{position:absolute;left:12px;bottom:8px;font-size:12.5px;color:#8a8f88;pointer-events:none}
.calc{border:1px solid var(--line);background:var(--card2);border-radius:12px;padding:12px;margin-bottom:12px}
.wbox{border:1px solid var(--line);background:var(--card2);border-radius:12px;padding:10px 12px;margin:-4px 0 14px;font-variant-numeric:tabular-nums}
.wbox .wr{display:flex;justify-content:space-between;gap:10px;padding:3px 0;font-size:14px}
.wbox .wr span:first-child{min-width:0}
.wbox .wr small{color:var(--ink2);margin-left:4px}
.wbox .wr span:last-child{font-family:var(--num);white-space:nowrap}
.wbox .wr.net{border-top:1px solid var(--line2);margin-top:4px;padding-top:7px;font-size:15.5px;color:var(--acc)}
.calc .two{gap:8px}
.calc-out{font-family:var(--num);font-size:13.5px;border-top:1px solid var(--line);margin-top:6px;padding-top:8px}
.calc-out div{display:flex;justify-content:space-between;padding:2px 0}
.calc-out .fin{font-weight:700;font-size:15.5px;color:var(--acc)}
.stick{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -4px 18px rgba(0,0,0,.08)}
.stick .in2{max-width:680px;margin:0 auto;display:flex;gap:8px;align-items:center}
.stick .btn{flex:1}
.prog{font-family:var(--num);font-size:12.5px;font-weight:700;color:var(--ink2);white-space:nowrap}

/* ---------- media ---------- */
.mbtns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.mbtns .btn{flex-direction:column;gap:2px;padding:9px 4px;font-size:13.5px;min-height:62px}
.mbtns .btn span{font-size:21px;line-height:1}
.mbtns .btn.rec{background:var(--bad);border-color:var(--bad);color:#fff}
.mitem{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:8px;margin-bottom:8px;background:var(--card2)}
.mthumb{width:76px;height:76px;border-radius:9px;background:var(--mute-soft);flex:none;overflow:hidden;display:grid;place-items:center;font-size:26px;position:relative}
.mthumb img,.mthumb video{width:100%;height:100%;object-fit:cover}
.mthumb .pr{position:absolute;left:0;right:0;bottom:0;height:5px;background:rgba(0,0,0,.25)}
.mthumb .pr i{display:block;height:100%;background:var(--gold)}
.mbody{flex:1;min-width:0}
.mbody audio{width:100%;height:36px;margin-bottom:4px}
.mbody input{width:100%;border:1px solid var(--line2);background:var(--card);border-radius:9px;padding:7px 9px;font-size:15px}
.mmeta{display:flex;align-items:center;gap:8px;margin-top:5px;font-size:13px;color:var(--ink2);flex-wrap:wrap}
.mmeta label{display:flex;align-items:center;gap:5px;cursor:pointer}
.mmeta input[type=checkbox]{width:18px;height:18px;accent-color:var(--g7)}
.mdel{flex:none;border:none;background:none;font-size:18px;cursor:pointer;color:var(--ink2);padding:2px 4px}
.mvoice{display:flex;align-items:center;gap:4px;margin-top:6px}
.mvoice audio{flex:1;min-width:0;height:36px;margin:0}
.btn.rec-on{background:var(--bad);border-color:var(--bad);color:#fff}
.gal{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.gi{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card2)}
.gi.wide{grid-column:1/-1}
.gi img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;cursor:zoom-in;background:var(--mute-soft)}
.gi video{display:block;width:100%;max-height:340px;background:#000}
.gi audio{display:block;width:100%;margin:10px 0 0}
.gi .cap{padding:7px 9px;font-size:14px}
.gi .cap small{display:block;color:var(--ink2);font-size:12px}
.lock{font-size:12px;font-weight:600;color:var(--gold-ink);background:var(--gold-soft);border-radius:6px;padding:1px 6px;display:inline-block;margin-bottom:3px}

/* ---------- detail ---------- */
.dhead{background:linear-gradient(120deg,var(--g7),var(--g9));color:var(--cream);border-radius:var(--r);padding:15px;margin-bottom:12px;box-shadow:var(--shadow)}
.dhead .no{font-family:"Playfair Display",Georgia,serif;font-size:26px;font-weight:700;letter-spacing:.5px}
.dhead .sub{font-size:14px;opacity:.85}
.dhead .row{margin-top:8px}
.dues{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.due{background:rgba(255,255,255,.07);border:1px solid rgba(231,177,80,.35);border-radius:12px;padding:8px 10px}
.due small{display:block;font-size:12px;color:var(--gold);font-weight:600;letter-spacing:.3px}
.due b{display:block;font-size:15.5px}
.due .cnt{margin-top:4px}
.alertbox{border-radius:var(--r);padding:13px 14px;margin-bottom:12px;border:1.5px solid}
.alertbox.bad{background:var(--bad-soft);border-color:var(--bad)}
.alertbox.gold{background:var(--gold-soft);border-color:var(--gold)}
.alertbox.ok{background:var(--ok-soft);border-color:var(--ok)}
.alertbox h4{margin:0 0 4px;font-size:16px}
.alertbox p{margin:0 0 10px;white-space:pre-wrap}
.kv{display:grid;grid-template-columns:42% 1fr;border-top:1px solid var(--line)}
.kv>div{padding:8px 2px;border-bottom:1px solid var(--line);font-size:15px;min-width:0;overflow-wrap:anywhere}
.kv>div:nth-child(odd){color:var(--ink2);font-size:14px}
.kv>div:nth-child(even){font-weight:600}
.kv .full{grid-column:1/-1;font-weight:500!important;color:var(--ink)!important;white-space:pre-wrap;font-size:15px!important}
.edited{font-size:11.5px;font-weight:600;color:var(--warn);background:var(--warn-soft);border-radius:6px;padding:0 5px;margin-left:5px;white-space:nowrap}
.steps{list-style:none;margin:0;padding:0}
.steps li{display:flex;gap:10px;align-items:center;padding:5px 0;font-size:14.5px;color:var(--ink2);position:relative}
.steps li .d{width:22px;height:22px;border-radius:50%;border:2px solid var(--line2);flex:none;display:grid;place-items:center;font-size:12px;background:var(--card)}
.steps li.done{color:var(--ink)}
.steps li.done .d{background:var(--g7);border-color:var(--g7);color:var(--gold)}
.steps li.cur{color:var(--ink);font-weight:700}
.steps li.cur .d{border-color:var(--gold);background:var(--gold);color:var(--g9)}
.steps li small{margin-left:auto;font-size:12.5px;color:var(--ink2);font-weight:400}
.money{font-family:var(--num);font-weight:700}
.pay{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14.5px}
.tot{display:flex;justify-content:space-between;padding:6px 0;font-size:15.5px}
.tot.big{font-size:17px;font-weight:700}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.tl .ic{width:30px;height:30px;border-radius:50%;background:var(--mute-soft);display:grid;place-items:center;flex:none;font-size:15px}
.tl .tx{flex:1;min-width:0;font-size:14.5px;white-space:pre-wrap;overflow-wrap:anywhere}
.tl .tx small{display:block;color:var(--ink2);font-size:12.5px;margin-top:1px}

<script>

/* Firebase adapter: the app talks only to window.DO_BACKEND */
(function(){
  if (window.DO_BACKEND || !window.firebase || !window.DO_CONFIG || !window.DO_CONFIG.apiKey) return;
  const cfg = window.DO_CONFIG;
  firebase.initializeApp(cfg);
  const auth = firebase.auth();
  const fs = firebase.firestore();
  try { fs.enablePersistence({synchronizeTabs: true}).catch(() => {}); } catch (e) {}
  const st = firebase.storage();
  let sec = null;
  const secondary = () => (sec = sec || firebase.initializeApp(cfg, 'do-secondary'));
  const toUser = u => u ? {uid: u.uid, email: u.email} : null;
  const flatten = (obj, pre, out) => {
    out = out || {};
    for (const k of Object.keys(obj)) {
      const v = obj[k], key = pre ? pre + '.' + k : k;
      if (v && typeof v === 'object' && !Array.isArray(v) && Object.getPrototypeOf(v) === Object.prototype && Object.keys(v).length) flatten(v, key, out);
      else out[key] = v;
    }
    return out;
  };
  const q = (col, filters, opts) => {
    let r = fs.collection(col);
    (filters || []).forEach(f => { r = r.where(f[0], f[1], f[2]); });
    if (opts && opts.orderBy) r = r.orderBy(opts.orderBy[0], opts.orderBy[1] || 'asc');
    if (opts && opts.limit) r = r.limit(opts.limit);
    return r;
  };
  const docs = snap => snap.docs.map(d => ({id: d.id, data: d.data()}));
  window.DO_BACKEND = {
    projectId: cfg.projectId,
    auth: {
      onChange: cb => auth.onAuthStateChanged(u => cb(toUser(u))),
      current: () => toUser(auth.currentUser),
      signIn: (email, pw) => auth.signInWithEmailAndPassword(email, pw).then(c => toUser(c.user)),
      signUpSelf: (email, pw) => auth.createUserWithEmailAndPassword(email, pw).then(c => toUser(c.user)),
      signOut: () => auth.signOut(),
      createUser: async (email, pw) => {
        const a = secondary().auth();
        await a.setPersistence(firebase.auth.Auth.Persistence.NONE);
        const c = await a.createUserWithEmailAndPassword(email, pw);
        const uid = c.user.uid;
        await a.signOut();
        return uid;
      },
      changePassword: async (cur, nw) => {
        const u = auth.currentUser;
        if (!u) throw {code: 'auth/no-user'};
        await u.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(u.email, cur));
        await u.updatePassword(nw);
      },
      sendReset: email => auth.sendPasswordResetEmail(email)
    },
    storage: {
      upload: (path, blob, contentType, onProgress) => new Promise((resolve, reject) => {
        const ref = st.ref(path);
        const task = ref.put(blob, {contentType: contentType || blob.type || 'application/octet-stream'});
        task.on('state_changed',
          s => { if (onProgress && s.totalBytes) onProgress(s.bytesTransferred / s.totalBytes); },
          reject,
          () => ref.getDownloadURL().then(url => resolve({url, path}), reject));
      })
    },
    db: {
      newId: col => fs.collection(col).doc().id,
      get: path => fs.doc(path).get().then(s => ({exists: s.exists, data: s.exists ? s.data() : null})),
      set: (path, data) => fs.doc(path).set(data),
      update: (path, data) => fs.doc(path).update(flatten(data)),
      batch: ops => {
        const b = fs.batch();
        ops.forEach(o => {
          const r = fs.doc(o.path);
          if (o.op === 'set') b.set(r, o.data); else if (o.op === 'update') b.update(r, flatten(o.data)); else b.delete(r);
        });
        return b.commit();
      },
      /* Reads counter doc, writes counter+1 and the docs built from the new number — all in one transaction. */
      counterTx: (counterPath, build) => fs.runTransaction(async tx => {
        const cref = fs.doc(counterPath);
        const s = await tx.get(cref);
        const n = (s.exists ? (s.data().n || 0) : 0) + 1;
        tx.set(cref, {n});
        build(n).forEach(o => tx.set(fs.doc(o.path), o.data));
        return n;
      }),
      watchDoc: (path, cb, err) => fs.doc(path).onSnapshot(s => cb({exists: s.exists, data: s.exists ? s.data() : null}), err),
      watchQuery: (col, filters, cb, err, opts) => q(col, filters, opts).onSnapshot(snap => {
        cb(docs(snap), snap.docChanges().map(c => ({type: c.type, id: c.doc.id, pending: c.doc.metadata.hasPendingWrites})), {fromCache: snap.metadata.fromCache});
      }, err),
      getQuery: (col, filters, opts) => q(col, filters, opts).get().then(docs),
      /* every orders/{id}/private/info doc (admin dashboard); id = the order id */
      getGroup: name => fs.collectionGroup(name).get().then(snap => snap.docs.map(d => ({id: d.ref.parent.parent ? d.ref.parent.parent.id : d.id, data: d.data()}))),
      del: path => fs.doc(path).delete()
    },
    push: {
      supported: async () => { try { return !!(firebase.messaging && await Promise.resolve(firebase.messaging.isSupported())); } catch (e) { return false; } },
      token: (vapidKey, registration) => firebase.messaging().getToken({vapidKey, serviceWorkerRegistration: registration})
    }
  };
})();
</script>

  return r !== 'err';
}

    if (o.status !== n.status) {

      if (n.status === 'factory' && o.status !== 'factory' && r === 'store') evs.push(['Approved', n.no + ' has been sent to the factory']);
      if (n.status === 'dispatched' && r !== 'factory') evs.push(['Dispatched', n.no + ' has left the factory']);

    }
    if (o.stage !== n.stage && n.stage === 'cad_approval' && r !== 'factory') evs.push(['CAD approval required', n.no]);

  }
  const d = diffDays(day, today());
  if (d < 0) return `<span class="cnt bad"><b>${-d}</b> ${plural(-d, 'day')} late</span>`;
  if (d === 0) return `<span class="cnt bad">Due today</span>`;

  if (d <= 5) return `<span class="cnt gold"><b>${d}</b> ${plural(d, 'day')} left</span>`;

/* reads the slip, fills the automatic numbers, returns {actual, bill} */
function dpCompute(){
  const sh = S.sheet; if (!sh || !sh.lines) return null;
  const gross = num(dpVal('gross'));
  let stoneCt = 0;
  const lines = sh.lines.map(l => {
    const key = l.kind + l.n, ct = num(dpVal(key + '-ct')), pcs = dpVal(key + '-pcs');
    stoneCt += ct;
    const rate = num(dpVal(key + '-rate'));
    const amtEl = document.getElementById('dp-' + key + '-amt');
    if (rate && amtEl && !amtEl.dataset.manual) amtEl.value = String(Math.round(ct * rate));
    return {kind: l.kind, n: l.n, type: l.type, ct, pcs, cert: l.kind === 'd' ? dpPick(key + '-cert') : '', certNo: l.kind === 'd' ? dpVal(key + '-certno') : '', rate, amt: num(amtEl ? amtEl.value : 0)};

function loadScript(src){

function sealData(city){

  const x = c.getContext('2d');

  x.strokeStyle = '#0d3b25'; x.fillStyle = '#0d3b25';
  x.lineWidth = 7; x.beginPath(); x.arc(0, 0, 186, 0, Math.PI * 2); x.stroke();
  x.lineWidth = 2.5; x.beginPath(); x.arc(0, 0, 150, 0, Math.PI * 2); x.stroke();

async function htmlToPdf(html, width){
  await Promise.all(LIBS.map(loadScript));

  wrap.innerHTML = html;
  document.body.appendChild(wrap);
  await Promise.all(Array.from(wrap.querySelectorAll('img')).map(i => i.complete ? null : new Promise(r => { i.onload = i.onerror = r; })));
  try { await document.fonts.ready; } catch (e) {}
  const canvas = await window.html2canvas(wrap.firstElementChild, {scale: 2, backgroundColor: '#ffffff', useCORS: true, logging: false});
  wrap.remove();
  /* one page, A5 width, as long as the content (never cut into pages) */
  const pw = 419.53, ph = Math.max(595.28, canvas.height * pw / canvas.width);
  const pdf = new window.jspdf.jsPDF({unit: 'pt', format: [pw, ph], orientation: 'portrait'});
  pdf.addImage(canvas.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, pw, canvas.height * pw / canvas.width);
  return {pdf, canvas};
}

/* Estimate — everything on NET gold weight:
   every diamond line and gemstone: carat × 0.200 g (1 ct = 200 mg);
   net gold g = gross weight g − all stones in g; gold = net × gold rate; making = net × making ₹/g;
   each diamond line = its ct × its ₹ per carat. */
function calcValues(c, spec){
  c = c || {}; spec = spec || {};
  const gross = num(c.grossWt);
  const has = v => v != null && String(v).trim() !== '';
  /* final bill: actual carats from the factory slip override the ordered ones */
  const dct = n => has(c['dct' + n]) ? num(c['dct' + n]) : num(spec['dia' + n + 'Ct']);
  const gct = n => has(c['gct' + n]) ? num(c['gct' + n]) : num(spec['gem' + n + 'Ct']);
  const dias = DIA_N.filter(n => hasDia(spec['dia' + n + 'Ct'])).map(n => {
    const ct = dct(n), rate = num(c['d' + n + 'Rate']);
    return {n, type: spec['dia' + n + 'Type'] || '', ct, g: ct * CT_TO_G, rate, amt: ct * rate};
  });
  const gems = [1, 2].filter(n => spec['gem' + n + 'Type'] && gct(n) > 0).map(n => {
    const ct = gct(n); return {n, type: spec['gem' + n + 'Type'], ct, g: ct * CT_TO_G};
  });
  if (!gems.length && num(c.gemWt)) gems.push({n: 1, type: 'Gemstone', ct: num(c.gemWt), g: num(c.gemWt) * CT_TO_G});   /* older orders */
  const diaCt = dias.reduce((a, d) => a + d.ct, 0);
  const gemCt = gems.reduce((a, d) => a + d.ct, 0);
  const stoneCt = diaCt + gemCt;
  const stoneG = stoneCt * CT_TO_G;
  const netAuto = Math.max(0, gross - stoneG);
  const netGiven = num(c.netWt) > 0;                 /* factory weighed the net gold itself */
  const net = netGiven ? num(c.netWt) : netAuto;
  const gold = net * num(c.goldRate), mk = net * num(c.making);
  const diaTotal = dias.reduce((a, d) => a + d.amt, 0);
  const value = gold + diaTotal + mk + num(c.gemAmt) + num(c.other);
  const gstAmt = value * num(c.gst) / 100;
  return {gross, dias, gems, diaCt, gemCt, stoneCt, stoneG, net, netAuto, netGiven, gold, diaTotal, mk, gem: num(c.gemAmt), oth: num(c.other), value, gstPct: num(c.gst), gstAmt, final: value + gstAmt};
}
/* the weight working: gross − each stone (ct → g) = net gold */
function weightHtml(c, spec){
  const v = calcValues(c, spec);
  if (!v.gross && !v.stoneCt) return `<div class="small muted">Enter the gross weight — diamond and gemstone carats are converted to grams (1 ct = 0.200 g) and deducted, and the <b>net gold weight</b> appears here. All charges are calculated on the net weight.</div>`;
  const row = (l, val, cls) => `<div class="wr ${cls || ''}"><span>${l}</span><span>${val}</span></div>`;
  let h = row('Gross weight', esc(fmtG(v.gross)));
  const ctTxt = ct => (Math.round(ct * 1000) / 1000).toFixed(2) + ' ct = ' + fmtG(ct * CT_TO_G);

    if (f && !inF) { setp(main, 'media.' + m.id, d); if (inP) setp(priv, 'media.' + m.id + '.deleted', true); else mAdd++; }
    if (!f && !inP) { setp(priv, 'media.' + m.id, d); if (inF) setp(main, 'media.' + m.id + '.deleted', true); else mAdd++; }
    if (f && inF) { if ((oldF[m.id].desc || '') !== d.desc) setp(main, 'media.' + m.id + '.desc', d.desc); if ((oldF[m.id].voiceUrl || '') !== (d.voiceUrl || '')) { setp(main, 'media.' + m.id + '.voiceUrl', d.voiceUrl || ''); setp(main, 'media.' + m.id + '.voicePath', d.voicePath || ''); mAdd++; } }
    if (!f && inP && (oldP[m.id].desc || '') !== d.desc) setp(priv, 'media.' + m.id + '.desc', d.desc);
  });
  const ids = new Set(nowMedia.map(m => m.id));
  Object.keys(oldF).forEach(k => { if (!oldF[k].deleted && !ids.has(k)) { setp(main, 'media.' + k + '.deleted', true); mDel++; } });
  Object.keys(oldP).forEach(k => { if (!oldP[k].deleted && !ids.has(k)) { setp(priv, 'media.' + k + '.deleted', true); mDel++; } });
  if (mAdd) mainTxt.push(mAdd + ' new photo / video / voice note(s) added');
  if (mDel) mainTxt.push(mDel + ' photo / video(s) removed');
  if (!Object.keys(main).length && !Object.keys(priv).length) { toast('Nothing was changed.'); return go('#/o/' + id); }
  const ops = [];
  if (Object.keys(main).length || mainTxt.length) {
    main.log = {[logKey()]: logEntry('edited', 'Changes:\n' + (mainTxt.join('\n') || 'Details update'))};
    if (Object.keys(edited).length) main.edited = edited;
    if (fresh.status === 'factory' && mainTxt.length) main.factoryAck = false;
    ops.push({op: 'update', path: 'orders/' + id, data: stamp(main)});
  }
  if (Object.keys(priv).length) {
    if (privTxt.length) priv.log = {[logKey()]: logEntry('price', 'Changes:\n' + privTxt.join('\n'))};
    ops.push({op: 'update', path: 'orders/' + id + '/private/info', data: priv});
  }
  const ok = await batch(ops);
  if (!ok) return;
  FORMKEY = null; F = null; FP = null; FIP = null;
  toast('Changes saved.' + (fresh.status === 'factory' && mainTxt.length ? ' The factory has been alerted.' : ''));
  go('#/o/' + id);
}

const monthKey = ms => { const d = new Date(ms); return d.getFullYear() + '-' + pad(d.getMonth() + 1); };

function niceMax(v){ if (v <= 0) return 4; const p = Math.pow(10, Math.floor(Math.log10(v))); const n = v / p; const m = n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10; return m * p; }

function lineChart(id, keys, values, fmt, unit, minMax){
  const W = 380, H = 210, L = 40, R = 16, T = 22, Bm = 26;
  const pts = values.map((v, i) => v == null ? null : v);
  const raw = Math.max(minMax || 1, ...pts.filter(v => v != null));
  const max = id === 'orders' ? Math.ceil(raw / 4) * 4 : niceMax(raw);   /* counts: whole-number ticks */
  const xs = i => L + (keys.length === 1 ? (W - L - R) / 2 : i * (W - L - R) / (keys.length - 1));
  const ys = v => T + (H - T - Bm) * (1 - v / max);
  const yearful = keys.length && keys[0].slice(0, 4) !== keys[keys.length - 1].slice(0, 4);
  const every = Math.max(1, Math.ceil(keys.length / 6));
  let g = '';
  for (let i = 0; i <= 4; i++) { const v = max * i / 4, y = ys(v); g += `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/><text x="${L - 6}" y="${y + 4}" text-anchor="end" font-size="11.5" fill="var(--ink2)">${esc(compact(v))}</text>`; }
  keys.forEach((k, i) => { if ((keys.length - 1 - i) % every === 0) g += `<text x="${xs(i)}" y="${H - 7}" text-anchor="${i === 0 && keys.length > 1 ? 'start' : 'middle'}" font-size="11.5" fill="var(--ink2)">${esc(monthLabel(k, yearful && (i === 0 || k.endsWith('-01'))))}</text>`; });

  const flush = () => { if (seg.length) { path += 'M' + seg.map(p => p.join(',')).join('L'); if (seg.length > 1) area += `<path d="M${seg[0][0]},${ys(0)}L${seg.map(p => p.join(',')).join('L')}L${seg[seg.length - 1][0]},${ys(0)}Z" fill="var(--chart-wash)"/>`; } seg = []; };
  pts.forEach((v, i) => { if (v == null) flush(); else seg.push([xs(i).toFixed(1), ys(v).toFixed(1)]); });
  flush();
  const lastI = pts.map((v, i) => v == null ? -1 : i).filter(i => i >= 0).pop();
  let end = '';
  if (lastI != null && lastI >= 0) end = `<circle cx="${xs(lastI)}" cy="${ys(pts[lastI])}" r="5" fill="var(--chart)" stroke="var(--card)" stroke-width="2"/><text x="${Math.min(xs(lastI), W - R - 4)}" y="${ys(pts[lastI]) - 11}" text-anchor="${xs(lastI) > W - 60 ? 'end' : 'middle'}" font-size="12.5" font-weight="700" fill="var(--ink)">${esc(fmt(pts[lastI]))}</text>`;
  const singles = pts.map((v, i) => v != null && (pts[i - 1] == null) && (pts[i + 1] == null) && i !== lastI ? `<circle cx="${xs(i)}" cy="${ys(v)}" r="4" fill="var(--chart)" stroke="var(--card)" stroke-width="2"/>` : '').join('');
  const svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(unit)}" data-chart="${id}">${g}${area}<path d="${path}" fill="none" stroke="var(--chart)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>${singles}${end}<line class="xh" x1="0" x2="0" y1="${T}" y2="${H - Bm}" stroke="var(--ink2)" stroke-width="1" opacity="0"/><circle class="xd" r="5" fill="var(--chart)" stroke="var(--card)" stroke-width="2" opacity="0"/><rect x="${L}" y="0" width="${W - L - R}" height="${H}" fill="transparent" data-hover="${id}"/></svg>`;
  CHARTS[id] = {keys, pts, fmt, unit, xs, ys, W};
  const table = `<details class="tv"><summary>View as table</summary><div class="scroll-x"><table class="tbl"><tr><th>Month</th><th>${esc(unit)}</th></tr>${keys.map((k, i) => `<tr><td>${esc(monthLabel(k, true))}</td><td>${pts[i] == null ? '—' : esc(fmt(pts[i]))}</td></tr>`).join('')}</table></div></details>`;

const CHARTS = {};
function chartHover(e, el){

  const svg = el.ownerSVGElement, box = svg.getBoundingClientRect();

  const wrap = document.getElementById('ch-' + id), tip = wrap.querySelector('.tip'), xh = svg.querySelector('.xh'), xd = svg.querySelector('.xd');
  if (best < 0) return;
  const px = c.xs(best), py = c.ys(c.pts[best]);
  xh.setAttribute('x1', px); xh.setAttribute('x2', px); xh.setAttribute('opacity', '.5');
  xd.setAttribute('cx', px); xd.setAttribute('cy', py); xd.setAttribute('opacity', '1');
  tip.hidden = false; tip.innerHTML = esc(monthLabel(c.keys[best], true)) + ' · <b>' + esc(c.fmt(c.pts[best])) + '</b>';

}
function chartLeave(el){ const id = el.dataset.hover; const wrap = document.getElementById('ch-' + id); if (!wrap) return; wrap.querySelector('.tip').hidden = true; const svg = wrap.querySelector('svg'); svg.querySelector('.xh').setAttribute('opacity', '0'); svg.querySelector('.xd').setAttribute('opacity', '0'); }
function renderDash(){
  if (!S.dash && !S.dashLoading) { loadDash(); }
  let h = `<div class="row" style="margin-bottom:4px"><div class="view-title" style="margin:4px 0 6px">Business Dashboard</div><span class="grow"></span><button class="btn sm" data-act="dash-reload" ${S.dashLoading ? 'disabled' : ''}>${S.dashLoading ? 'Loading…' : '↻ Refresh'}</button></div>`;
  const stores = storeList();
  h += `<div class="filters">` + [['all', 'All stores']].concat(stores.map(s => [s.id, s.name])).map(x => `<button class="fchip ${S.dashStore === x[0] ? 'on' : ''}" data-act="dash-store" data-v="${esc(x[0])}">🏬 ${esc(x[1])}</button>`).join('') + `</div>`;
  h += `<div class="filters">` + [[6, '6 months'], [12, '12 months'], [0, 'All']].map(x => `<button class="fchip ${S.dashRange === x[0] ? 'on' : ''}" data-act="dash-range" data-v="${x[0]}">${x[1]}</button>`).join('') + `</div>`;
  if (!S.dash) { patch($('#view'), h + '<div class="empty">Loading the dashboard…</div>'); return; }
  const rowsAll = S.dash.rows.filter(r => S.dashStore === 'all' || r.o.storeId === S.dashStore);
  const now = new Date();
  const firstMs = r => r.o.createdAt || 0;
  const minMs = rowsAll.length ? Math.min(...rowsAll.map(firstMs)) : now.getTime();
  const start = S.dashRange ? new Date(now.getFullYear(), now.getMonth() - S.dashRange + 1, 1) : new Date(new Date(minMs).getFullYear(), new Date(minMs).getMonth(), 1);
  const keys = []; for (let d = new Date(start); d <= now; d.setMonth(d.getMonth() + 1)) keys.push(d.getFullYear() + '-' + pad(d.getMonth() + 1));
  const inRange = ms => ms && ms >= start.getTime();
  const live = rowsAll.filter(r => r.o.status !== 'cancelled');
  const period = live.filter(r => inRange(r.o.createdAt));
  const total = r => num(r.p.price && (r.p.price.final || r.p.price.est));
  const booked = period.reduce((a, r) => a + total(r), 0);
  const collected = rowsAll.reduce((a, r) => a + Object.values(r.p.payments || {}).filter(x => !x.deleted && inRange(parseDay(x.day || '1970-01-01').getTime() || x.at)).reduce((s, x) => s + num(x.amount), 0), 0);
  const pending = live.reduce((a, r) => a + Math.max(0, total(r) - paidTotal(r.p)), 0);
  const made = live.filter(r => r.o.dispatch && r.o.dispatch.at && r.o.approvedAt && inRange(r.o.dispatch.at));
  const days = r => (r.o.dispatch.at - r.o.approvedAt) / 86400000;
  const avgDays = made.length ? made.reduce((a, r) => a + days(r), 0) / made.length : null;
  const onTime = made.filter(r => r.o.factoryDue && dayOf(new Date(r.o.dispatch.at)) <= r.o.factoryDue);
  const onPct = made.filter(r => r.o.factoryDue).length ? Math.round(onTime.length / made.filter(r => r.o.factoryDue).length * 100) : null;
  const inFactory = live.filter(r => r.o.status === 'factory');
  const lateNow = inFactory.filter(r => r.o.factoryDue && diffDays(r.o.factoryDue, today()) < 0);
  h += `<div class="kpis">
    <div class="kpi hero"><small>Business booked (${S.dashRange ? S.dashRange + ' months' : 'All'})</small><b>${money(booked)}</b><span>${period.length} ${period.length === 1 ? 'order' : 'orders'} · received ${money(collected)}</span></div>
    <div class="kpi"><small>Orders</small><b>${period.length}</b><span>in this period</span></div>
    <div class="kpi"><small>Average making time</small><b>${avgDays == null ? '—' : avgDays.toFixed(1) + ' days'}</b><span>approval to dispatch</span></div>
    <div class="kpi"><small>On-time dispatch</small><b>${onPct == null ? '—' : onPct + '%'}</b><span>${onTime.length} / ${made.filter(r => r.o.factoryDue).length} orders</span></div>
    <div class="kpi"><small>Outstanding balance</small><b>${money(pending)}</b><span>all active orders</span></div>
    <div class="kpi"><small>Currently in factory</small><b>${inFactory.length}</b><span>${lateNow.length ? '<span style="color:var(--bad);font-weight:700">' + lateNow.length + ' late</span>' : 'none late'}</span></div>
    <div class="kpi"><small>Awaiting approval</small><b>${live.filter(r => r.o.status === 'review' || r.o.status === 'query').length}</b><span>including queries</span></div>
    <div class="kpi"><small>Delivered</small><b>${period.filter(r => r.o.status === 'delivered').length}</b><span>in this period</span></div>
  </div>`;
  const byMonth = (list, msOf, val) => { const m = {}; list.forEach(r => { const ms = msOf(r); if (!inRange(ms)) return; const k = monthKey(ms); (m[k] = m[k] || []).push(val(r)); }); return m; };
  const cnt = byMonth(live, firstMs, () => 1);
  const val = byMonth(live, firstMs, total);
  const dd = byMonth(made, r => r.o.dispatch.at, days);
  h += `<div class="card"><h3>Orders received per month</h3>${lineChart('orders', keys, keys.map(k => (cnt[k] || []).length), v => Math.round(v) + (Math.round(v) === 1 ? ' order' : ' orders'), 'Orders', 4)}</div>`;
  h += `<div class="card"><h3>Average days to make an order</h3><p class="small muted" style="margin:-6px 0 6px">From approval to factory dispatch, by month of dispatch</p>${lineChart('days', keys, keys.map(k => dd[k] ? dd[k].reduce((a, b) => a + b, 0) / dd[k].length : null), v => v.toFixed(1) + ' days', 'Average days', 10)}</div>`;
  h += `<div class="card"><h3>Business per month (₹)</h3><p class="small muted" style="margin:-6px 0 6px">Agreed amounts, by month of order</p>${lineChart('value', keys, keys.map(k => (val[k] || []).reduce((a, b) => a + b, 0)), v => money(v), 'Business ₹', 10000)}</div>`;
  /* pipeline now */
  const pipe = [['Awaiting approval', r => r.o.status === 'review'], ['Query', r => r.o.status === 'query']].concat(STAGES.filter(s => s[0] !== 'dispatched').map(s => [STAGE_SHORT[s[0]], r => r.o.status === 'factory' && r.o.stage === s[0]])).concat([['Dispatched (in transit)', r => r.o.status === 'dispatched'], ['At store (awaiting delivery)', r => r.o.status === 'received']]);
  const pc = pipe.map(p => [p[0], live.filter(p[1]).length]).filter(x => x[1] > 0);
  const pmax = Math.max(1, ...pc.map(x => x[1]));
  h += `<div class="card"><h3>Where each order is now</h3>${pc.length ? `<div class="bars">${pc.map(x => `<div class="br"><span>${esc(x[0])}</span><span class="tr"><i style="width:${Math.max(4, x[1] / pmax * 100)}%"></i></span><b>${x[1]}</b></div>`).join('')}</div>` : '<p class="muted small" style="margin:0">No active orders.</p>'}</div>`;
  /* store-wise */
  if (stores.length) {
    const rowsP = S.dash.rows.filter(r => r.o.status !== 'cancelled');
    h += `<div class="card"><h3>Store-wise</h3><div class="scroll-x"><table class="tbl"><tr><th>Store</th><th>Orders</th><th>Business</th><th>Average days</th><th>On time</th><th>Active</th></tr>` + stores.map(s => {
      const rs = rowsP.filter(r => r.o.storeId === s.id), rp = rs.filter(r => inRange(r.o.createdAt));
      const mk = rs.filter(r => r.o.dispatch && r.o.dispatch.at && r.o.approvedAt && inRange(r.o.dispatch.at));
      const ad = mk.length ? (mk.reduce((a, r) => a + days(r), 0) / mk.length).toFixed(1) : '—';
      const withDue = mk.filter(r => r.o.factoryDue);
      const ot = withDue.length ? Math.round(withDue.filter(r => dayOf(new Date(r.o.dispatch.at)) <= r.o.factoryDue).length / withDue.length * 100) + '%' : '—';
      return `<tr><td>${esc(s.name)}</td><td>${rp.length}</td><td>${money(rp.reduce((a, r) => a + total(r), 0))}</td><td>${ad}</td><td>${ot}</td><td>${rs.filter(r => ACTIVE.includes(r.o.status)).length}</td></tr>`;
    }).join('') + `</table></div></div>`;
  }
  /* what sells */
  const types = {}; period.forEach(r => { const t = jtypeOf(r.o.spec); if (t) types[t] = (types[t] || 0) + 1; });
  const tl = Object.entries(types).sort((a, b) => b[1] - a[1]).slice(0, 8);
  if (tl.length) { const tm = tl[0][1]; h += `<div class="card"><h3>Most-ordered items</h3><div class="bars">${tl.map(x => `<div class="br"><span>${esc(x[0])}</span><span class="tr"><i style="width:${Math.max(4, x[1] / tm * 100)}%"></i></span><b>${x[1]}</b></div>`).join('')}</div></div>`; }
  h += `<p class="small muted center">Updated ${esc(fmtWhen(S.dash.at))}</p>`;
  patch($('#view'), h);
}

  if (!S.dash) { patch($('#view'), h + '<div class="empty">Loading activity…</div>'); return; }
  /* history from the last load + live data for open orders */
  const rows = {};
  S.dash.rows.forEach(r => { rows[r.id] = {o: r.o, p: r.p}; });
  Object.keys(S.orders).forEach(id => { rows[id] = {o: S.orders[id], p: S.priv[id] || (rows[id] && rows[id].p) || {}}; });
  let ev = [];
  for (const id in rows) {
    const {o, p} = rows[id];
    if (S.actStore !== 'all' && o.storeId !== S.actStore) continue;
    const client = (p && p.client && p.client.name) || '';
    Object.values(o.log || {}).forEach(x => ev.push(Object.assign({id, no: o.no, storeId: o.storeId, client}, x)));
    Object.values((p && p.log) || {}).forEach(x => ev.push(Object.assign({id, no: o.no, storeId: o.storeId, client, priv: true}, x)));
  }
  if (S.actWho === 'money') ev = ev.filter(x => x.type === 'payment' || x.type === 'price');
  else if (S.actWho === 'admin') ev = ev.filter(x => ADMIN_ROLES.includes(x.role));
  else if (S.actWho !== 'all') ev = ev.filter(x => x.role === S.actWho);
  const q = S.actQ.trim().toLowerCase();
  if (q) ev = ev.filter(x => [x.no, x.name, x.text, x.client].join(' ').toLowerCase().includes(q));
  ev.sort((a, b) => (b.at || 0) - (a.at || 0));
  const total = ev.length;
  ev = ev.slice(0, S.actLimit);
  if (!ev.length) h += `<div class="empty"><b>No activity</b>Try a different filter.</div>`;
  let lastDay = '';
  h += ev.map(x => {
    const d = dayOf(new Date(x.at || 0));
    let head = '';
    if (d !== lastDay) { lastDay = d; head = `<div class="lbl" style="margin:14px 2px 6px;color:var(--gold-ink)">${d === today() ? 'Today' : d === addDays(today(), -1) ? 'Yesterday' : esc(fmtDay(d))}</div>`; }
    return head + `<a class="ocard" href="#/o/${esc(x.id)}" style="padding:10px 12px;margin-bottom:8px"><div style="display:flex;gap:10px"><span class="ic" style="width:30px;height:30px;border-radius:50%;background:var(--mute-soft);display:grid;place-items:center;flex:none">${LOGICON[x.type] || '•'}</span>
      <div style="min-width:0;flex:1"><div style="font-size:14.5px;white-space:pre-wrap;overflow-wrap:anywhere">${x.priv ? '<span class="lock">🔒</span> ' : ''}${esc(x.text)}</div>
      <div class="small muted" style="margin-top:2px">${esc(x.name || '')}${x.role ? ' (' + esc(ROLES[x.role] || x.role) + ')' : ''} · ${esc(fmtTime(x.at || 0))} · <b style="color:var(--ink)">${esc(x.no || '')}</b>${x.client ? ' · ' + esc(x.client) : ''}${stores.length > 1 && x.storeId ? ' · 🏬 ' + esc(storeName(x.storeId)) : ''}</div></div></div></a>`;
  }).join('');
  if (total > ev.length) h += `<button class="btn big" data-act="act-more" style="margin-top:8px">Show more (${total - ev.length} remaining)</button>`;
  patch($('#view'), h);
}

    case 'sched-open': sheetSchedule(oid); break;
    case 'pdf': makeReceiptPdf(oid || (S.sheet && S.sheet.id), false); break;
    case 'pdf-wa': makeReceiptPdf(oid || (S.sheet && S.sheet.id), true); break;
    case 'fpdf': makeFactoryPdf(t.dataset.id || oid || (S.sheet && S.sheet.id)); break;
    case 'sched-do': doSchedule(); break;
    case 'cancel-open': sheetCancel(oid); break;
    case 'cancel-do': doCancel(); break;
    case 'reopen': doReopen(); break;
    case 'seen': doSeen(); break;
    case 'u-add': addUser(); break;
    case 'u-menu': userMenu(t.dataset.uid); break;
    case 'um-phone': write('users/' + S.sheet.uid, {phone: phone10($('#um-phone').value)}).then(ok => ok && toast('Saved.')); break;
    case 'um-role': { const v = t.dataset.v, uid = S.sheet.uid; askConfirm('Change the role of ' + S.users[uid].name + '?', 'New role: ' + ROLES[v], 'Yes, change', () => write('users/' + uid, {role: v}).then(ok => { if (ok) toast('Role changed.'); })); break; }
    case 'um-newpw': userNewPw(); break;
    case 'um-off': { const uid = S.sheet.uid; askConfirm('Disable the login of ' + S.users[uid].name + '?', 'They will no longer be able to open the app. Orders they created will remain unchanged.', 'Yes, disable', () => write('users/' + uid, {active: false}).then(ok => { if (ok) toast('Login disabled.'); }), true); break; }
    case 'um-newpw-do': userNewPwDo(); break;
    case 'um-store': { const v = t.dataset.v, uid = S.sheet.uid; const ex = Object.entries(S.users).find(([k, u]) => k !== uid && u.active && u.role === 'store' && u.storeId === v); if (ex) { toast(storeName(v) + ' already has ' + ex[1].name + ' as its manager.', 'bad'); break; } write('users/' + uid, {storeId: v}).then(ok => { if (ok) { closeSheet(); toast('Store changed.'); } }); break; }
    case 'store-new': sheetStore(''); break;
    case 'store-edit': sheetStore(t.dataset.sid); break;
    case 'store-save': saveStore(); break;
    case 'brand-sign': sheetBrandSign(); break;
    case 'bsig-clear': if (S.sheet && S.sheet.sig) S.sheet.sig.clear(); break;
    case 'brand-save': saveBrandSign(); break;
    case 'rates-open': sheetRates(); break;
    case 'rates-save': saveRates(); break;
    case 'copy': { const tx = t.dataset.t; if (NATIVE && NATIVE.copy) NATIVE.copy(tx); else if (navigator.clipboard) navigator.clipboard.writeText(tx).catch(() => {}); toast('Copied.'); break; }
    case 'mic-lang': write('users/' + S.authUser.uid, {micLang: t.dataset.v}).then(ok => ok && toast('Language changed.')); break;
    case 'pw-change': {
      const cur = $('#pw-cur').value, nw = $('#pw-new').value;
      if (nw.length < 6) { showErr('#pw-err', 'The new password must be at least 6 characters.'); break; }
      B.auth.changePassword(cur, nw).then(() => { showErr('#pw-err', ''); $('#pw-cur').value = ''; $('#pw-new').value = ''; toast('Password changed.'); }, err => showErr('#pw-err', authErr(err)));
      break;
    }
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'q') { S.q = t.value; render(); return; }
  if (t.id === 'aq') { S.actQ = t.value; render(); return; }
  if (t.dataset && t.dataset.f && F && FORMKEY) { onFormInput(t); return; }
  if (t.dataset && t.dataset.fb && S.sheet && S.sheet.calc) { S.sheet.calc[t.dataset.fb] = t.value; updateFinalCalc(false); return; }
  if (t.dataset && t.dataset.dp && S.sheet && S.sheet.lines) {
    if (t.dataset.dp === 'net') S.sheet.netManual = t.value.trim() !== '';
    if (/-amt$/.test(t.dataset.dp)) t.dataset.manual = t.value.trim() ? '1' : '';
    dpUpdate(); return;
  }
  if (t.dataset && t.dataset.desc) { const p = PICKERS[t.dataset.p]; if (p && p.items[t.dataset.desc]) { p.items[t.dataset.desc].desc = t.value; if (p.opts.onChange) p.opts.onChange(); } }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset && t.dataset.pick) {
    const p = PICKERS[t.dataset.p];
    if (p) Array.from(t.files || []).forEach(f => p.add(f, t.dataset.pick));
    t.value = '';
    return;
  }
  if (t.dataset && t.dataset.fact) { const p = PICKERS[t.dataset.p]; if (p && p.items[t.dataset.fact]) { p.items[t.dataset.fact].factory = t.checked; if (p.opts.onChange) p.opts.onChange(); } return; }
  if (t.id === 'f-ack' && F) { F.ack.accepted = t.checked; $('#w-f-ack').classList.remove('miss'); renderFormBar(); saveDraft(); }
  if (t.id === 'f-remote' && F) { F.ack.remote = t.checked; $('#w-sig').hidden = t.checked; renderFormBar(); saveDraft(); }
});
document.addEventListener('pointermove', e => { const t = e.target.closest && e.target.closest('[data-hover]'); if (t) chartHover(e, t); });
document.addEventListener('pointerdown', e => { const t = e.target.closest && e.target.closest('[data-hover]'); if (t) chartHover(e, t); });
document.addEventListener('pointerout', e => { const t = e.target.closest && e.target.closest('[data-hover]'); if (t) chartLeave(t); });
document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'setup-form') doSetup();
  if (e.target.id === 'login-form') doLogin();
});
window.addEventListener('hashchange', () => { closeSheet(); S.route = parseRoute(); render(); });
/* Android back button: close a dialog / photo first */
window.__doBack = () => {
  const lb = document.querySelector('.lightbox'); if (lb) { lb.remove(); return true; }
  if ($('#sheet .sheet')) { closeSheet(); return true; }
  return false;
};
function net(){ $('#net').hidden = navigator.onLine !== false; }
window.addEventListener('online', net); window.addEventListener('offline', net);

/* ---------- boot ---------- */
function boot(){
  net();
  if (!B) {
    $('#view').innerHTML = `<div class="auth"><div class="logo"><img src="icons/wordmark.png" alt="Deeva"></div><div class="card"><h3>Setup pending</h3><p>The app is not yet connected to Firebase (the configuration is empty), or there is no internet connection.</p></div></div>`;
    return;
  }
  S.route = parseRoute();
  B.auth.onChange(async u => {
    if (u) {
      if (S.authUser && S.authUser.uid === u.uid) return;
      stopAll(); S.booted = true; startSession(u); S.route = parseRoute(); render(); return;
    }
    stopAll(); S.authUser = null;
    try { const a = await B.db.get('config/admin'); S.needSetup = !a.exists; } catch (e) { S.needSetup = false; }
    S.booted = true; S.route = {v: ''}; render();
  });
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
}
boot();
})();
</script>
</body>
